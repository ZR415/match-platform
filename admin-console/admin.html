/* ============ 图标（复用 lucide UMD，兼容两种节点结构） ============ */
const ICON_ALIAS = {
  'alert-triangle': 'TriangleAlert',
  'alert-circle': 'CircleAlert',
  'check-circle': 'CircleCheck',
  'bar-chart': 'ChartColumn',
  'pie-chart': 'ChartPie',
  'trending-up': 'TrendingUp',
  'file-check': 'FileCheck',
};
const pascal = (s) => s.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');

const Icon = ({ name, size = 18, className = '', fill = false }) => {
  const icons = (typeof lucide !== 'undefined' && lucide.icons) || {};
  const key = ICON_ALIAS[name] || pascal(name);
  const node = icons[key] || icons[pascal(name)] || null;

  let list = [];
  if (node) {
    if (Array.isArray(node) && node[0] === 'svg' && Array.isArray(node[2])) list = node[2];
    else if (Array.isArray(node) && typeof node[0] === 'string') list = [node];
    else if (Array.isArray(node)) list = node;
  }
  const children = list
    .filter(c => Array.isArray(c) && typeof c[0] === 'string')
    .map((c, i) => React.createElement(c[0], { key: i, ...(c[1] || {}) }));

  return (
    <svg width={size} height={size} viewBox="0 0 24 24" className={className}
      fill={fill ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="1.8"
      strokeLinecap="round" strokeLinejoin="round"
      style={{ display: 'inline-block', verticalAlign: 'middle', flexShrink: 0 }}>
      {children.length > 0 ? children : <circle cx="12" cy="12" r="4" opacity="0.35" />}
    </svg>
  );
};

/* 按钮规范：主按钮=品牌色，次要按钮=白底浅灰边框，统一 rounded-md */
const Btn = ({ variant = 'primary', className = '', disabled, onClick, children }) => {
  const styles = {
    primary: 'bg-brand hover:bg-brand-dark text-white shadow-sm',
    danger: 'bg-red-600 hover:bg-red-700 text-white shadow-sm',
    ghost: 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-50',
  }[variant];
  return (
    <button type="button" disabled={disabled} onClick={onClick}
      className={`inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-md text-sm font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed ${styles} ${className}`}>
      {children}
    </button>
  );
};

const Badge = ({ tone = 'gray', children }) => {
  const map = {
    gray: 'bg-gray-100 text-gray-600',
    green: 'bg-emerald-50 text-emerald-700',
    red: 'bg-red-50 text-red-600',
    amber: 'bg-amber-50 text-amber-700',
    blue: 'bg-blue-50 text-blue-700',
  };
  return <span className={`inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium ${map[tone]}`}>{children}</span>;
};

  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
      <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-[3px]" onClick={onClose} />
      <div className={`relative w-full ${width} bg-white rounded-2xl shadow-2xl flex flex-col max-h-[86vh] scale-in`}>
        <div className="flex items-start justify-between px-6 pt-5 pb-4">
          <div>
            <h3 className="text-base font-semibold text-gray-900">{title}</h3>

  return (
    <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[60] fade-in">

    </div>
  );
};

const DashboardPage = () => {

    return [x, y];
  });

  const area = `M ${points[0][0]},${H - PAD} ` + points.map(p => `L ${p[0]},${p[1]}`).join(' ') + ` L ${points[points.length - 1][0]},${H - PAD} Z`;

                  <stop offset="0%" stopColor="#2F6B4F" stopOpacity="0.22" />

                  stroke="#EEF1F3" strokeWidth="1" />
              ))}
              <path d={area} fill="url(#areaFill)" />

/* ============ 审核中心 ============ */
const AuditPage = () => {
  const { reports, setReports, appeals, setAppeals, pending, setPending, users, setUsers, posts, setPosts } = useData();
  const [tab, setTab] = useState('report');
  const [sel, setSel] = useState({ report: reports[0]?.id, appeal: appeals[0]?.id, content: pending[0]?.id });

  const [ignoreOpen, setIgnoreOpen] = useState(false);
  const [ignoreReason, setIgnoreReason] = useState('证据不足');
  const [banOpen, setBanOpen] = useState(false);
  const [banType, setBanType] = useState('骚扰辱骂用户');
  const [banDays, setBanDays] = useState('7 天');
  const [banEscalate, setBanEscalate] = useState(false);
  const [banNote, setBanNote] = useState('');

  /* 申诉处理弹窗：reject=驳回 / revoke=撤销差评 */
  const [appealAct, setAppealAct] = useState(null);
  const [appealReason, setAppealReason] = useState('证据不足');
  const [appealNote, setAppealNote] = useState('');

  /* 内容审核弹窗：off=下架 / pass=通过 */
  const [contentAct, setContentAct] = useState(null);
  const [contentType, setContentType] = useState('广告引流');
  const [contentNote, setContentNote] = useState('');

  const TABS = [
    { k: 'report', label: '投诉举报', count: reports.filter(r => r.status === '待处理').length },
    { k: 'appeal', label: '评价申诉', count: appeals.filter(a => a.status === '待处理').length },
    { k: 'content', label: '内容审核', count: pending.length },
  ];

  const report = reports.find(r => r.id === sel.report) || reports[0];
  const appeal = appeals.find(a => a.id === sel.appeal) || appeals[0];
  const content = pending.find(p => p.id === sel.content) || pending[0];

  /* 忽略举报：弹窗选择原因 → 移出列表 */
  const dropReport = (id) => {
    const rest = reports.filter(x => x.id !== id);
    setReports(rest);
    setSel(s => ({ ...s, report: rest[0]?.id }));
  };

  const confirmIgnore = () => {
    if (!report) return;
    dropReport(report.id);
    setIgnoreOpen(false);
    setToast(`已忽略举报 ${report.id}（${ignoreReason}）`);
  };

  /* 封禁并删帖：封禁用户 + 下架帖子 + 可选上报安全中心 */
  const openBan = (r) => {
    setBanType(r.type);
    setBanDays('7 天');
    setBanEscalate(r.type === '涉嫌骗取费用');
    setBanNote('');
    setBanOpen(true);
  };

  const confirmBan = () => {
    if (!report) return;
    setUsers(prev => prev.map(u => u.name === report.target
      ? { ...u, status: banDays === '永久' ? '永久封禁' : '封禁中', daysLeft: banDays === '永久' ? undefined : parseInt(banDays, 10), banReason: banType }
      : u));
    setPosts(prev => prev.map(p => p.title === report.post ? { ...p, status: '已下架' } : p));
    if (banEscalate) {
      setReports(prev => prev.map(x => x.id === report.id
        ? { ...x, status: '已上报', banType, banDays, escalateNote: banNote } : x));
    } else {
      dropReport(report.id);
    }
    setBanOpen(false);
    setToast(banEscalate
      ? `已封禁用户 ${report.target}，并上报平台安全中心`
      : `已封禁用户 ${report.target}，关联帖子已删除`);
  };

  /* 申诉：驳回 / 撤销差评，均需填写理由 */
  const submitAppeal = () => {
    if (!appeal || !appealAct) return;
    const revoke = appealAct === 'revoke';
    setAppeals(prev => prev.map(x => x.id === appeal.id
      ? { ...x, status: '已处理', stars: revoke ? 0 : x.stars, action: revoke ? '撤销差评' : '驳回', reason: appealReason, note: appealNote }
      : x));
    setAppealAct(null);
    setToast(revoke ? `已撤销差评（${appealReason}）` : `已驳回申诉（${appealReason}）`);
  };

  /* 内容审核：下架 / 通过 */
  const submitContent = () => {
    if (!content || !contentAct) return;
    const pass = contentAct === 'pass';
    const rest = pending.filter(x => x.id !== content.id);
    setPending(rest);
    setSel(s => ({ ...s, content: rest[0]?.id }));
    setContentAct(null);
    setToast(pass ? '审核通过，内容已发布' : `已下架该内容（${contentType}）`);
  };

  const [toast, setToast] = useState('');
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 2200); return () => clearTimeout(t); }, [toast]);

  /* ---------- 左栏表格 ---------- */
  const LeftTable = () => {
    if (tab === 'report') {
      return (
        <table className="w-full text-sm">
          <thead>
            <tr className="text-xs text-gray-500 bg-gray-50">
              <th className="text-left font-semibold px-4 py-2.5">编号</th>
              <th className="text-left font-semibold px-4 py-2.5">被举报人</th>
              <th className="text-left font-semibold px-4 py-2.5">类型</th>
              <th className="text-left font-semibold px-4 py-2.5">状态</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-100">
            {reports.map(r => (
              <tr key={r.id} onClick={() => setSel(s => ({ ...s, report: r.id }))}
                className={`cursor-pointer transition-colors ${sel.report === r.id ? 'bg-brand-soft/70' : 'hover:bg-gray-50'}`}>
                <td className="px-4 py-3">
                  <div className="text-xs font-medium text-gray-800">{r.id}</div>
                  <div className="text-[11px] text-gray-400 mt-0.5">{r.time}</div>
                </td>
                <td className="px-4 py-3 text-xs text-gray-700">{r.target}</td>
                <td className="px-4 py-3"><span className="text-xs text-gray-600">{r.type}</span></td>
                <td className="px-4 py-3">
                  <Badge tone={r.status === '待处理' ? 'amber' : (r.status === '已上报' ? 'red' : 'gray')}>{r.status}</Badge>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      );
    }
    if (tab === 'appeal') {
      return (
        <table className="w-full text-sm">
          <thead>
            <tr className="text-xs text-gray-500 bg-gray-50">
              <th className="text-left font-semibold px-4 py-2.5">编号</th>
              <th className="text-left font-semibold px-4 py-2.5">申诉人</th>
              <th className="text-left font-semibold px-4 py-2.5">星级</th>
              <th className="text-left font-semibold px-4 py-2.5">状态</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-100">
            {appeals.map(a => (
              <tr key={a.id} onClick={() => setSel(s => ({ ...s, appeal: a.id }))}
                className={`cursor-pointer transition-colors ${sel.appeal === a.id ? 'bg-brand-soft/70' : 'hover:bg-gray-50'}`}>
                <td className="px-4 py-3">
                  <div className="text-xs font-medium text-gray-800">{a.id}</div>
                  <div className="text-[11px] text-gray-400 mt-0.5">{a.time}</div>
                </td>
                <td className="px-4 py-3 text-xs text-gray-700">{a.user}</td>
                <td className="px-4 py-3">
                  <span className="text-xs text-amber-500">{'★'.repeat(a.stars)}<span className="text-gray-300">{'★'.repeat(5 - a.stars)}</span></span>
                </td>
                <td className="px-4 py-3"><Badge tone={a.status === '待处理' ? 'amber' : 'gray'}>{a.status}</Badge></td>
              </tr>
            ))}
          </tbody>
        </table>
      );
    }
    return (
      <table className="w-full text-sm">
        <thead>
          <tr className="text-xs text-gray-500 bg-gray-50">
            <th className="text-left font-semibold px-4 py-2.5">标题</th>
            <th className="text-left font-semibold px-4 py-2.5">作者</th>
            <th className="text-left font-semibold px-4 py-2.5">分类</th>
            <th className="text-left font-semibold px-4 py-2.5">时间</th>
          </tr>
        </thead>
        <tbody className="divide-y divide-gray-100">
          {pending.map(p => (
            <tr key={p.id} onClick={() => setSel(s => ({ ...s, content: p.id }))}
              className={`cursor-pointer transition-colors ${sel.content === p.id ? 'bg-brand-soft/70' : 'hover:bg-gray-50'}`}>
              <td className="px-4 py-3 text-xs text-gray-800 max-w-[180px] truncate">{p.title}</td>
              <td className="px-4 py-3 text-xs text-gray-600">{p.author}</td>
              <td className="px-4 py-3 text-xs text-gray-500">{p.cat}</td>
              <td className="px-4 py-3 text-[11px] text-gray-400">{p.time}</td>
            </tr>
          ))}
        </tbody>
      </table>
    );
  };

  /* ---------- 右侧详情 ---------- */
  const EvidenceBlock = ({ label }) => (
    <div className="rounded-lg bg-gray-50 h-20 flex flex-col items-center justify-center gap-1 text-gray-400">
      <Icon name="image" size={18} />
      <span className="text-[10px]">{label}</span>
    </div>
  );

  const ReportDetail = () => (
    <div className="flex flex-col h-full">
      <div className="flex items-start justify-between">
        <div>
          <div className="text-sm font-semibold text-gray-900">举报详情 {report.id}</div>
          <div className="text-xs text-gray-400 mt-1">{report.time} · 举报人 {report.reporter}</div>
        </div>
        <Badge tone={report.status === '待处理' ? 'amber' : (report.status === '已上报' ? 'red' : 'gray')}>{report.status}</Badge>
      </div>

      <div className="mt-4 grid grid-cols-2 gap-3 text-xs">
        <div className="bg-gray-50 rounded-lg px-3 py-2.5">
          <div className="text-gray-400 mb-1">被举报人</div>
          <div className="text-gray-800 font-medium">{report.target}</div>
        </div>
        <div className="bg-gray-50 rounded-lg px-3 py-2.5">
          <div className="text-gray-400 mb-1">举报类型</div>
          <div className="text-gray-800 font-medium">{report.type}</div>
        </div>
      </div>

      <div className="mt-4">
        <div className="text-xs text-gray-400 mb-1.5">关联帖子</div>
        <div className="text-xs text-gray-700 bg-gray-50 rounded-lg px-3 py-2.5">{report.post}</div>
      </div>

      <div className="mt-4">
        <div className="text-xs text-gray-400 mb-1.5">举报说明</div>
        <div className="text-xs text-gray-600 leading-relaxed bg-gray-50 rounded-lg px-3 py-3">{report.desc}</div>
      </div>

      <div className="mt-4">
        <div className="text-xs text-gray-400 mb-1.5">凭证材料</div>
        <div className="grid grid-cols-3 gap-2">
          {report.evidence.map(e => <EvidenceBlock key={e} label={e} />)}
        </div>
      </div>

      <div className="mt-auto pt-5 flex items-center justify-end gap-3">
        <Btn variant="ghost" disabled={report.status !== '待处理'}
          onClick={() => { setIgnoreReason('证据不足'); setIgnoreOpen(true); }}>
          忽略举报
        </Btn>
        <Btn variant="danger" disabled={report.status !== '待处理'}
          onClick={() => openBan(report)}>
          封禁并删帖
        </Btn>
      </div>
    </div>
  );

  const AppealDetail = () => (
    <div className="flex flex-col h-full">
      <div className="flex items-start justify-between">
        <div>
          <div className="text-sm font-semibold text-gray-900">申诉详情 {appeal.id}</div>
          <div className="text-xs text-gray-400 mt-1">{appeal.related} · {appeal.time}</div>
        </div>
        <Badge tone={appeal.status === '待处理' ? 'amber' : 'gray'}>{appeal.status}</Badge>
      </div>

      <div className="mt-4 rounded-lg bg-red-50/60 px-3 py-3">
        <div className="flex items-center justify-between mb-1.5">
          <span className="text-xs font-medium text-red-600">原评价（{appeal.from} 提交）</span>
          <span className="text-xs text-amber-500">{'★'.repeat(appeal.stars)}</span>
        </div>
        <div className="text-xs text-gray-700 leading-relaxed">{appeal.review}</div>
      </div>

      <div className="mt-3 rounded-lg bg-emerald-50/70 px-3 py-3">
        <div className="text-xs font-medium text-emerald-700 mb-1.5">申诉理由（{appeal.user} 提交）</div>
        <div className="text-xs text-gray-700 leading-relaxed">{appeal.appeal}</div>
      </div>

      <div className="mt-4 grid grid-cols-2 gap-3 text-xs">
        <div className="bg-gray-50 rounded-lg px-3 py-2.5">
          <div className="text-gray-400 mb-1">评价人</div>
          <div className="text-gray-800 font-medium">{appeal.from}</div>
        </div>
        <div className="bg-gray-50 rounded-lg px-3 py-2.5">
          <div className="text-gray-400 mb-1">申诉人</div>
          <div className="text-gray-800 font-medium">{appeal.user}</div>
        </div>
      </div>

      <div className="mt-auto pt-5 flex items-center justify-end gap-3">
        <Btn variant="ghost" disabled={appeal.status !== '待处理'}
          onClick={() => { setAppealAct('reject'); setAppealReason('证据不足'); setAppealNote(''); }}>
          驳回
        </Btn>
        <Btn variant="primary" disabled={appeal.status !== '待处理'}
          onClick={() => { setAppealAct('revoke'); setAppealReason('举证充分'); setAppealNote(''); }}>
          撤销差评
        </Btn>
      </div>
    </div>
  );

  const ContentDetail = () => (
    <div className="flex flex-col h-full">
      <div className="flex items-start justify-between">
        <div>
          <div className="text-sm font-semibold text-gray-900">内容预览 {content.id}</div>
          <div className="text-xs text-gray-400 mt-1">{content.author} · {content.cat} · {content.time}</div>
        </div>
        <Badge tone="blue">待审核</Badge>
      </div>

      <div className="mt-4 rounded-lg border border-gray-100 px-4 py-4">
        <div className="text-sm font-semibold text-gray-900 leading-snug">{content.title}</div>
        <div className="flex flex-wrap gap-1.5 mt-2.5">
          {content.tags.map(t => (
            <span key={t} className="text-[11px] bg-[#E8F0EB] text-brand px-2 py-0.5 rounded">#{t}</span>
          ))}
        </div>
        <div className="text-xs text-gray-600 leading-relaxed mt-3 whitespace-pre-line">{content.body}</div>
      </div>

      <div className="text-[11px] text-amber-600 bg-amber-50 rounded-lg px-3 py-2 mt-3 flex items-start gap-1.5">
        <Icon name="alert-triangle" size={13} className="mt-0.5" />
        系统提示：该内容命中「代写/有偿」敏感词，建议人工复核。
      </div>

      <div className="mt-auto pt-5 flex items-center justify-end gap-3">
        <Btn variant="danger"
          onClick={() => { setContentAct('off'); setContentType('广告引流'); setContentNote(''); }}>
          下架
        </Btn>
        <Btn variant="primary"
          onClick={() => { setContentAct('pass'); setContentNote(''); }}>
          通过
        </Btn>
      </div>
    </div>
  );

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl font-bold text-gray-900 tracking-tight">审核中心</h1>
        <p className="text-sm text-gray-500 mt-1">处理用户举报、评价申诉与内容审核任务</p>

      <Card>

              className={`relative py-3.5 text-sm transition-colors ${tab === t.k ? 'text-brand font-semibold' : 'text-gray-500 hover:text-gray-800'}`}>
              {t.label}
              <span className={`ml-1.5 text-[11px] px-1.5 py-0.5 rounded ${tab === t.k ? 'bg-brand-soft text-brand' : 'bg-gray-100 text-gray-400'}`}>{t.count}</span>
              {tab === t.k && <span className="absolute left-0 right-0 -bottom-px h-0.5 bg-brand rounded" />}
            </button>
          ))}
        </div>

        <div className="grid grid-cols-[1.05fr_0.95fr]">
          <div className="border-r border-gray-100 overflow-auto max-h-[calc(100vh-300px)]">
            <LeftTable />
          </div>
          <div className="p-6 overflow-auto max-h-[calc(100vh-300px)]">
            {tab === 'report' && report && <ReportDetail />}
            {tab === 'appeal' && appeal && <AppealDetail />}

                <Icon name="check-circle" size={30} className="mb-2" />
                <div className="text-xs">当前队列已清空</div>
              </div>
            )}

        </div>

      {/* 忽略举报：必须选择理由 */}

        open={ignoreOpen}

        subtitle={`确认忽略举报 ${report ? report.id : ''}？忽略后将移出待处理队列`}

        footer={
          <>
            <Btn variant="ghost" onClick={() => setIgnoreOpen(false)}>取消</Btn>
            <Btn variant="primary" onClick={confirmIgnore}>确认忽略</Btn>

      >
        <label className="block text-xs font-medium text-gray-600 mb-1.5">违规类型</label>
        <select value={banType} onChange={e => setBanType(e.target.value)}
          className="w-full bg-gray-50 rounded-md px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-brand/20 mb-4">
          {['骚扰辱骂用户', '发布虚假信息', '涉嫌骗取费用', '内容违规', '冒充他人身份', '其他'].map(r => (

          <span className={`w-4 h-4 mt-0.5 rounded border flex items-center justify-center shrink-0 ${banEscalate ? 'bg-red-600 border-red-600' : 'border-gray-300 bg-white'}`}>

        <textarea value={banNote} onChange={e => setBanNote(e.target.value)} rows={3}
          placeholder="请补充处理依据，将同步记录到操作日志"
          className="w-full bg-gray-50 rounded-md px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-brand/20" />
        <div className="text-[11px] text-gray-400 mt-2">封禁后该用户将无法登录、发帖与发起沟通。</div>
      </Modal>

      {/* 申诉处理：驳回 / 撤销差评 */}
      <Modal
        open={!!appealAct}
        title={appealAct === 'revoke' ? '撤销差评' : '驳回申诉'}
        subtitle={appeal ? `${appeal.id} · ${appeal.user} 对 ${appeal.from} 的评价提出申诉` : ''}
        onClose={() => setAppealAct(null)}
        footer={
          <>
            <Btn variant="ghost" onClick={() => setAppealAct(null)}>取消</Btn>
            <Btn variant={appealAct === 'revoke' ? 'primary' : 'danger'} onClick={submitAppeal}>确认提交</Btn>
          </>
        }
      >
        <div className="text-xs font-medium text-gray-600 mb-2">处理原因（单选）</div>
        <div className="space-y-2">
          {(appealAct === 'revoke'
            ? ['举证充分', '存在恶意评价', '沟通误会', '其他原因']
            : ['证据不足', '申诉理由不成立', '态度问题', '其他原因']).map(r => (
            <button key={r} type="button" onClick={() => setAppealReason(r)}
              className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-md text-sm transition-colors ${appealReason === r ? 'bg-brand-soft text-brand font-medium' : 'bg-gray-50 text-gray-700 hover:bg-gray-100'}`}>
              {r}
              <span className={`w-4 h-4 rounded-full border flex items-center justify-center ${appealReason === r ? 'border-brand bg-brand' : 'border-gray-300'}`}>
                {appealReason === r && <Icon name="check" size={10} className="text-white" />}
              </span>
            </button>
          ))}
        </div>

        <label className="block text-xs font-medium text-gray-600 mt-4 mb-1.5">补充说明</label>
        <textarea rows={3} value={appealNote} onChange={e => setAppealNote(e.target.value)}
          placeholder="请填写处理依据，将同步告知申诉双方"
          className="w-full bg-gray-50 rounded-md px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-brand/20" />
        <div className="text-[11px] text-gray-400 mt-2">
          {appealAct === 'revoke' ? '提交后该条差评将被撤销，申诉标记为「已处理」。' : '提交后该申诉标记为「已处理」，原评价保留。'}
        </div>
      </Modal>

      {/* 内容审核：下架 / 通过 */}
      <Modal
        open={!!contentAct}
        title={contentAct === 'pass' ? '审核通过' : '下架内容'}
        subtitle={content ? `${content.id} · ${content.title}` : ''}
        onClose={() => setContentAct(null)}
        footer={
          <>
            <Btn variant="ghost" onClick={() => setContentAct(null)}>取消</Btn>
            <Btn variant={contentAct === 'pass' ? 'primary' : 'danger'} onClick={submitContent}>
              {contentAct === 'pass' ? '确认通过' : '确认下架'}
            </Btn>
          </>
        }
      >
        {contentAct === 'off' && (
          <>
            <div className="text-xs font-medium text-gray-600 mb-2">违规类型（单选）</div>
            <div className="space-y-2">
              {['广告引流', '色情低俗', '违法违规', '其他'].map(r => (
                <button key={r} type="button" onClick={() => setContentType(r)}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-md text-sm transition-colors ${contentType === r ? 'bg-brand-soft text-brand font-medium' : 'bg-gray-50 text-gray-700 hover:bg-gray-100'}`}>
                  {r}
                  <span className={`w-4 h-4 rounded-full border flex items-center justify-center ${contentType === r ? 'border-brand bg-brand' : 'border-gray-300'}`}>
                    {contentType === r && <Icon name="check" size={10} className="text-white" />}
                  </span>
                </button>
              ))}
            </div>
          </>
        )}

        <label className="block text-xs font-medium text-gray-600 mt-4 mb-1.5">
          {contentAct === 'pass' ? '审核备注' : '补充说明'}
        </label>
        <textarea rows={3} value={contentNote} onChange={e => setContentNote(e.target.value)}
          placeholder={contentAct === 'pass' ? '可填写复核结论，选填' : '请填写下架依据，将同步给作者'}
          className="w-full bg-gray-50 rounded-md px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-brand/20" />
        <div className="text-[11px] text-gray-400 mt-2">
          {contentAct === 'pass' ? '确认后内容将在广场正常展示。' : '下架后内容从广场隐藏，作者可在站内信中查看原因。'}
        </div>
      </Modal>
    </div>
  );
};

/* ============ 用户管理 ============ */
const UsersPage = () => {
  const { users, setUsers } = useData();
  const [kw, setKw] = useState('');
  const [banTarget, setBanTarget] = useState(null);
  const [banReason, setBanReason] = useState('骚扰辱骂用户');
  const [banDays, setBanDays] = useState('7 天');
  const [banNote, setBanNote] = useState('');
  const [unbanTarget, setUnbanTarget] = useState(null);
  const [unbanReason, setUnbanReason] = useState('申诉通过');
  const [unbanNote, setUnbanNote] = useState('');
  const [toast, setToast] = useState('');

  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 2200); return () => clearTimeout(t); }, [toast]);

  const list = users.filter(u => kw.trim() === '' || (u.name + u.school + u.major + u.id).toLowerCase().includes(kw.trim().toLowerCase()));

  const submitBan = () => {
    if (!banTarget) return;
    const days = banDays === '永久' ? null : parseInt(banDays, 10);
    setUsers(prev => prev.map(u => u.id === banTarget.id
      ? { ...u, status: days === null ? '永久封禁' : '封禁中', daysLeft: days === null ? undefined : days, banReason, banDays }
      : u));
    setToast(`已封禁用户 ${banTarget.name}（${banDays}）`);
    setBanTarget(null);
  };

  const submitUnban = () => {
    if (!unbanTarget) return;
    setUsers(prev => prev.map(u => u.id === unbanTarget.id
      ? { ...u, status: '正常', daysLeft: undefined, unbanReason, unbanNote }
      : u));
    setToast(`已解除用户 ${unbanTarget.name} 的封禁`);
    setUnbanTarget(null);
  };

  const RadioRow = ({ active, onClick, children }) => (
    <button type="button" onClick={onClick}
      className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-md text-sm transition-colors ${active ? 'bg-brand-soft text-brand font-medium' : 'bg-gray-50 text-gray-700 hover:bg-gray-100'}`}>
      {children}
      <span className={`w-4 h-4 rounded-full border flex items-center justify-center ${active ? 'border-brand bg-brand' : 'border-gray-300'}`}>
        {active && <Icon name="check" size={10} className="text-white" />}
      </span>
    </button>
  );

  return (
    <div className="space-y-5">
      <div className="flex items-end justify-between">
        <div>
          <h1 className="text-2xl font-bold text-gray-900 tracking-tight">用户管理</h1>
          <p className="text-sm text-gray-500 mt-1">
            共 {users.length} 位用户 · 封禁中 {users.filter(u => u.status === '封禁中').length} 位 · 永久封禁 {users.filter(u => u.status === '永久封禁').length} 位
          </p>
        </div>
        <div className="flex items-center gap-2 bg-white rounded-md px-3 py-2 w-64 border border-gray-100 shadow-sm focus-within:ring-2 focus-within:ring-brand/20">
          <Icon name="search" size={16} className="text-gray-400" />
          <input value={kw} onChange={e => setKw(e.target.value)} placeholder="搜索姓名 / 学校 / 专业"
            className="flex-1 bg-transparent text-sm text-gray-800 focus:outline-none" />
        </div>
      </div>

      <Card className="overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-gray-50 text-xs text-gray-500">
              <th className="text-left font-semibold px-5 py-3">用户</th>
              <th className="text-left font-semibold px-5 py-3">学校 / 专业</th>
              <th className="text-left font-semibold px-5 py-3">信誉分</th>
              <th className="text-left font-semibold px-5 py-3">发帖</th>
              <th className="text-left font-semibold px-5 py-3">状态</th>
              <th className="text-left font-semibold px-5 py-3">注册时间</th>
              <th className="text-right font-semibold px-5 py-3">操作</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-100">
            {list.map(u => (
              <tr key={u.id} className="hover:bg-gray-50 transition-colors">
                <td className="px-5 py-3.5">
                  <div className="flex items-center gap-3">
                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold ${isBanned(u) ? 'bg-gray-100 text-gray-400' : 'bg-brand-soft text-brand'}`}>
                      {u.name.slice(0, 1)}
                    </div>
                    <div>
                      <div className="text-sm text-gray-800 font-medium">{u.name}</div>
                      <div className="text-[11px] text-gray-400">{u.id}</div>
                    </div>
                  </div>
                </td>
                <td className="px-5 py-3.5">
                  <div className="text-xs text-gray-700">{u.school}</div>
                  <div className="text-[11px] text-gray-400 mt-0.5">{u.major}</div>
                </td>
                <td className="px-5 py-3.5">
                  <span className="text-xs text-amber-500">{u.rating.toFixed(1)}</span>
                </td>
                <td className="px-5 py-3.5 text-xs text-gray-600">{u.posts}</td>
                <td className="px-5 py-3.5">
                  <Badge tone={statusTone(u)}>
                    <span className={`w-1.5 h-1.5 rounded-full mr-1.5 ${u.status === '正常' ? 'bg-emerald-500' : u.status === '封禁中' ? 'bg-amber-500' : 'bg-red-500'}`} />
                    {statusText(u)}
                  </Badge>
                </td>
                <td className="px-5 py-3.5 text-xs text-gray-400">{u.joined}</td>
                <td className="px-5 py-3.5 text-right">
                  {isBanned(u) ? (
                    <button onClick={() => { setUnbanTarget(u); setUnbanReason('申诉通过'); setUnbanNote(''); }}
                      className="text-xs px-3 py-1.5 rounded-md text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors">
                      解除封禁
                    </button>
                  ) : (
                    <button onClick={() => { setBanTarget(u); setBanReason('骚扰辱骂用户'); setBanDays('7 天'); setBanNote(''); }}
                      className="text-xs px-3 py-1.5 rounded-md text-red-600 bg-red-50 hover:bg-red-100 transition-colors">
                      封禁
                    </button>
                  )}
                </td>
              </tr>
            ))}
            {list.length === 0 && (
              <tr><td colSpan="7" className="px-5 py-14 text-center text-xs text-gray-400">没有匹配的用户</td></tr>
            )}
          </tbody>
        </table>
      </Card>

      {/* 封禁用户：原因 + 时长 */}
      <Modal
        open={!!banTarget}
        title="封禁用户"
        subtitle={banTarget ? `即将封禁「${banTarget.name}」· ${banTarget.school}` : ''}
        onClose={() => setBanTarget(null)}
        footer={
          <>
            <Btn variant="ghost" onClick={() => setBanTarget(null)}>取消</Btn>
            <Btn variant="danger" onClick={submitBan}>确认封禁</Btn>
          </>
        }
      >
        <div className="text-xs font-medium text-gray-600 mb-2">封禁原因</div>
        <div className="space-y-2">
          {BAN_REASONS.map(r => (
            <RadioRow key={r} active={banReason === r} onClick={() => setBanReason(r)}>{r}</RadioRow>
          ))}
        </div>

        <label className="block text-xs font-medium text-gray-600 mt-4 mb-1.5">补充说明（选填）</label>
        <textarea value={banNote} onChange={e => setBanNote(e.target.value)} rows={2}
          placeholder="请补充封禁依据，该记录将同步给用户"
          className="w-full bg-gray-50 rounded-md px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-brand/20" />

        <div className="text-xs font-medium text-gray-600 mt-4 mb-2">封禁时长</div>
        <div className="grid grid-cols-4 gap-2">
          {BAN_DAYS.map(d => (
            <button key={d} type="button" onClick={() => setBanDays(d)}
              className={`py-2 rounded-md text-xs transition-colors ${banDays === d ? 'bg-brand text-white font-medium' : 'bg-gray-50 text-gray-700 hover:bg-gray-100'}`}>
              {d}
            </button>
          ))}
        </div>
        <div className="text-[11px] text-gray-400 mt-2">封禁后该用户将无法登录、发帖与发起沟通。</div>
      </Modal>

      {/* 解除封禁 */}
      <Modal
        open={!!unbanTarget}
        title="解除封禁"
        subtitle={unbanTarget ? `即将恢复「${unbanTarget.name}」的账号权限（${statusText(unbanTarget)}）` : ''}
        onClose={() => setUnbanTarget(null)}
        footer={
          <>
            <Btn variant="ghost" onClick={() => setUnbanTarget(null)}>取消</Btn>
            <Btn variant="primary" onClick={submitUnban}>确认解除</Btn>
          </>
        }
      >
        <div className="text-xs font-medium text-gray-600 mb-2">解封理由</div>
        <div className="grid grid-cols-2 gap-2">
          {UNBAN_REASONS.map(r => (
            <button key={r} type="button" onClick={() => setUnbanReason(r)}
              className={`py-2 rounded-md text-xs transition-colors ${unbanReason === r ? 'bg-brand-soft text-brand font-medium' : 'bg-gray-50 text-gray-700 hover:bg-gray-100'}`}>
              {r}
            </button>
          ))}
        </div>
        <label className="block text-xs font-medium text-gray-600 mt-4 mb-1.5">补充说明</label>
        <textarea value={unbanNote} onChange={e => setUnbanNote(e.target.value)} rows={3}
          placeholder="如：申诉材料已核实，恢复账号权限"
          className="w-full bg-gray-50 rounded-md px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-brand/20" />
        <div className="text-[11px] text-gray-400 mt-2">解封后用户状态恢复为「正常」，记录进入审计日志。</div>
      </Modal>

      <Toast msg={toast} type="success" />
    </div>
  );
};

/* ============ 帖子管理 ============ */
const PostsPage = () => {
  const { posts, setPosts } = useData();
  const [kw, setKw] = useState('');
  const [target, setTarget] = useState(null);
  const [reason, setReason] = useState('');
  const [toast, setToast] = useState('');

  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 2200); return () => clearTimeout(t); }, [toast]);

  const list = posts.filter(p => kw.trim() === '' || (p.title + p.author + p.cat).toLowerCase().includes(kw.trim().toLowerCase()));

  return (

        <div className="flex items-center gap-2 bg-white rounded-lg px-3 py-2 w-64 shadow-sm focus-within:ring-2 focus-within:ring-brand/20">
          <Icon name="search" size={16} className="text-gray-400" />
          <input value={kw} onChange={e => setKw(e.target.value)} placeholder="搜索标题 / 作者 / 分类"
            className="flex-1 bg-transparent text-sm text-gray-800 focus:outline-none" />
        </div>
      </div>

      <Card className="overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-gray-50 text-xs text-gray-500">
              <th className="text-left font-semibold px-5 py-3">帖子标题</th>
              <th className="text-left font-semibold px-5 py-3">作者</th>
              <th className="text-left font-semibold px-5 py-3">分类</th>
              <th className="text-left font-semibold px-5 py-3">浏览 / 回复</th>
              <th className="text-left font-semibold px-5 py-3">状态</th>
              <th className="text-left font-semibold px-5 py-3">发布时间</th>
              <th className="text-right font-medium px-5 py-3">操作</th>

          </thead>
          <tbody className="divide-y divide-gray-100">

                  <div className="text-[11px] text-gray-400 mt-0.5">{p.id}</div>

                <td className="px-5 py-3.5 text-xs text-gray-700">{p.author}</td>
                <td className="px-5 py-3.5">
                  <span className="text-[11px] bg-[#E8F0EB] text-brand px-2 py-0.5 rounded">{p.cat}</span>
                </td>
                <td className="px-5 py-3.5 text-xs text-gray-500">{p.views} / {p.replies}</td>
                <td className="px-5 py-3.5">
                  <Badge tone={p.status === '正常' ? 'green' : 'gray'}>{p.status}</Badge>
                </td>
                <td className="px-5 py-3.5 text-xs text-gray-400">{p.time}</td>
                <td className="px-5 py-3.5 text-right">
                  <button disabled={p.status === '已下架'}

              <tr><td colSpan="7" className="px-5 py-14 text-center text-xs text-gray-400">没有匹配的帖子</td></tr>
            )}

      </Card>

      <Modal
        open={!!target}
        title="下架帖子"
        subtitle={target ? `${target.id} · ${target.title}` : ''}
        onClose={() => setTarget(null)}
        footer={
          <>
            <Btn variant="ghost" onClick={() => setTarget(null)}>取消</Btn>
            <Btn variant="danger" onClick={confirm}>确认下架</Btn>
          </>
        }
      >
        <label className="block text-xs font-medium text-gray-600 mb-1.5">下架原因<span className="text-red-500 ml-0.5">*</span></label>
        <textarea value={reason} onChange={e => setReason(e.target.value)} rows={3}
          placeholder="请填写下架原因，将用于向作者说明"
          className="w-full bg-gray-50 rounded-lg px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-brand/20" />
        <div className="text-[11px] text-gray-400 mt-2">下架后帖子将从广场隐藏，作者可在站内信中查看原因。</div>
      </Modal>

      <Toast msg={toast} type="success" />
    </div>
  );
};

  const [toastMsg, setToastMsg] = useState('');

  useEffect(() => {
    const onHash = () => setPath(getPath());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const navigate = (to) => {
    if (getPath() === to) return;
    window.location.hash = to;
    setPath(to);
  };

  const toast = (msg) => { setToastMsg(msg); };

  useEffect(() => { if (!toastMsg) return; const t = setTimeout(() => setToastMsg(''), 2200); return () => clearTimeout(t); }, [toastMsg]);

  const [users, setUsers] = useState(USERS_INIT);
  const [posts, setPosts] = useState(POSTS_INIT);
  const [reports, setReports] = useState(REPORTS_INIT);
  const [appeals, setAppeals] = useState(APPEALS_INIT);
  const [pending, setPending] = useState(PENDING_INIT);

  const data = useMemo(() => ({ users, setUsers, posts, setPosts, reports, setReports, appeals, setAppeals, pending, setPending }), [users, posts, reports, appeals, pending]);

  const login = () => {
    setAuthed(true);
    navigate('/dashboard');
  };

  const logout = () => {
    setAuthed(false);
    navigate('/login');
  };

  let screen = null;
  if (path.startsWith('/dashboard')) screen = <DashboardPage />;
  else if (path.startsWith('/audit')) screen = <AuditPage />;
  else if (path.startsWith('/users')) screen = <UsersPage />;
  else if (path.startsWith('/posts')) screen = <PostsPage />;

  return (
    <RouteCtx.Provider value={{ path, navigate }}>
      <DataCtx.Provider value={data}>
        {(!authed || path === '/login')
          ? <LoginPage onLogin={login} />
          : <Layout onLogout={logout}>{screen || <DashboardPage />}</Layout>}
        <Toast msg={toastMsg} type="success" />
      </DataCtx.Provider>
    </RouteCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
