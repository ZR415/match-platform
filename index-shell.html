<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>搭子Match - 校园组队 App</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: '#2F6B4F',
          'brand-dark': '#22503A',
          'brand-soft': '#E8F0EB',
          'bg-app': '#F5F7F5',
          'tag-bg': '#E8F0EB',
          'tag-text': '#2F6B4F',
        },
        boxShadow: {
          soft: '0 2px 10px rgba(0,0,0,0.03)',
          card: '0 8px 30px rgba(47,107,79,0.06)',
        }
      }
    }
  }
</script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  html, body { margin: 0; }
  body { background: #E7EEEA; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  input, textarea, select, button { font-family: inherit; }
  textarea { resize: none; }

  .fade-in { animation: fadeIn .22s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .slide-up { animation: slideUp .26s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .scale-in { animation: scaleIn .2s ease; }
  @keyframes scaleIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }

  .breath { animation: breath 3.4s ease-in-out infinite; }
  @keyframes breath { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.09); opacity: 1; } }

  .float-dot { animation: floatDot 5.5s ease-in-out infinite; }
  @keyframes floatDot { 0%, 100% { transform: translateY(0); opacity: .45; } 50% { transform: translateY(-10px); opacity: .9; } }

  .wave-bar { animation: waveBar 1s ease-in-out infinite; }
  @keyframes waveBar { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

  .shake { animation: shakeX .42s ease; }
  @keyframes shakeX { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

  .spin-slow { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .run-anim { animation: runBounce .55s ease-in-out infinite alternate; }
  @keyframes runBounce { from { transform: translateY(3px) rotate(-7deg); } to { transform: translateY(-5px) rotate(7deg); } }

  .pulse-dot { animation: pulseDot 1.4s infinite; }
  @keyframes pulseDot { 0%, 80%, 100% { transform: scale(0); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
/*__APP_CODE__*/
</script>
</body>
</html>
