/* ============ 图标（复用 lucide UMD，兼容两种节点结构） ============ */
const ICON_ALIAS = {
  'alert-triangle': 'TriangleAlert',
  'alert-circle': 'CircleAlert',
  'check-circle': 'CircleCheck',
  'bar-chart': 'ChartColumn',
  'pie-chart': 'ChartPie',
  'trending-up': 'TrendingUp',
  'file-check': 'FileCheck',
};
const pascal = (s) => s.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');

const Icon = ({ name, size = 18, className = '', fill = false }) => {
  const icons = (typeof lucide !== 'undefined' && lucide.icons) || {};
  const key = ICON_ALIAS[name] || pascal(name);
  const node = icons[key] || icons[pascal(name)] || null;

  let list = [];
  if (node) {
    if (Array.isArray(node) && node[0] === 'svg' && Array.isArray(node[2])) list = node[2];
    else if (Array.isArray(node) && typeof node[0] === 'string') list = [node];
    else if (Array.isArray(node)) list = node;
  }
  const children = list
    .filter(c => Array.isArray(c) && typeof c[0] === 'string')
    .map((c, i) => React.createElement(c[0], { key: i, ...(c[1] || {}) }));

  return (
    <svg width={size} height={size} viewBox="0 0 24 24" className={className}
      fill={fill ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="1.8"
      strokeLinecap="round" strokeLinejoin="round"
      style={{ display: 'inline-block', verticalAlign: 'middle', flexShrink: 0 }}>
      {children.length > 0 ? children : <circle cx="12" cy="12" r="4" opacity="0.35" />}
    </svg>
  );
};

const Card = ({ className = '', children }) => (

);

const Badge = ({ tone = 'gray', children }) => {
  const map = {
    gray: 'bg-gray-100 text-gray-600',
    green: 'bg-emerald-50 text-emerald-700',
    red: 'bg-red-50 text-red-600',
    amber: 'bg-amber-50 text-amber-700',
    blue: 'bg-blue-50 text-blue-700',
  };
  return <span className={`inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium ${map[tone]}`}>{children}</span>;
};

const Modal = ({ open, title, subtitle, onClose, children, footer, width = 'max-w-md' }) => {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
      <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-[3px]" onClick={onClose} />
      <div className={`relative w-full ${width} bg-white rounded-2xl shadow-2xl flex flex-col max-h-[86vh] scale-in`}>
        <div className="flex items-start justify-between px-6 pt-5 pb-4">
          <div>
            <h3 className="text-base font-semibold text-gray-900">{title}</h3>
            {subtitle && <p className="text-xs text-gray-500 mt-1">{subtitle}</p>}
          </div>
          <button onClick={onClose} className="p-1.5 -mr-1.5 rounded-lg text-gray-400 hover:bg-gray-100 transition-colors">
            <Icon name="x" size={18} />
          </button>
        </div>
        <div className="px-6 pb-5 overflow-y-auto">{children}</div>
        {footer && <div className="px-6 py-4 bg-gray-50 rounded-b-2xl flex items-center justify-end gap-3">{footer}</div>}
      </div>
    </div>
  );
};

const Toast = ({ msg, type }) => {
  if (!msg) return null;
  const icon = type === 'error' ? 'circle-alert' : 'circle-check';
  const color = type === 'error' ? 'text-red-400' : 'text-emerald-400';
  return (
    <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[60] fade-in">
      <div className="bg-slate-900/92 text-white text-sm px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2 whitespace-nowrap">
        <Icon name={icon} size={15} className={color} />
        {msg}
      </div>
    </div>
  );
};

/* ============ 应用入口 ============ */
const App = () => {
  const [path, setPath] = useState(getPath());
  const [authed, setAuthed] = useState(getPath() !== '/login');
  const [toastMsg, setToastMsg] = useState('');

  useEffect(() => {
    const onHash = () => setPath(getPath());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const navigate = (to) => {
    if (getPath() === to) return;
    window.location.hash = to;
    setPath(to);
  };

  const toast = (msg) => { setToastMsg(msg); };

  useEffect(() => { if (!toastMsg) return; const t = setTimeout(() => setToastMsg(''), 2200); return () => clearTimeout(t); }, [toastMsg]);

  const [users, setUsers] = useState(USERS_INIT);
  const [posts, setPosts] = useState(POSTS_INIT);
  const [reports, setReports] = useState(REPORTS_INIT);
  const [appeals, setAppeals] = useState(APPEALS_INIT);
  const [pending, setPending] = useState(PENDING_INIT);

  const data = useMemo(() => ({ users, setUsers, posts, setPosts, reports, setReports, appeals, setAppeals, pending, setPending }), [users, posts, reports, appeals, pending]);

  const login = () => {
    setAuthed(true);
    navigate('/dashboard');
  };

  const logout = () => {
    setAuthed(false);
    navigate('/login');
  };

  let screen = null;
  if (path.startsWith('/dashboard')) screen = <DashboardPage />;
  else if (path.startsWith('/audit')) screen = <AuditPage />;
  else if (path.startsWith('/users')) screen = <UsersPage />;
  else if (path.startsWith('/posts')) screen = <PostsPage />;

  return (
    <RouteCtx.Provider value={{ path, navigate }}>
      <DataCtx.Provider value={data}>
        {(!authed || path === '/login')
          ? <LoginPage onLogin={login} />
          : <Layout onLogout={logout}>{screen || <DashboardPage />}</Layout>}
        <Toast msg={toastMsg} type="success" />
      </DataCtx.Provider>
    </RouteCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
