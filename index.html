    >
      {a.emoji}
    </div>
  );
};

/* ---------- 图标（用 React 直接渲染 lucide SVG，保证状态更新正常） ---------- */
const ICON_ALIAS = {
  'alert-triangle': 'TriangleAlert',
  'alert-circle': 'CircleAlert',
  'plus-circle': 'CirclePlus',
  'check-circle': 'CircleCheck',
  'upload-cloud': 'CloudUpload',
  'more-horizontal': 'Ellipsis',
};
const pascal = (s) => s.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');

const Icon = ({ name, size = 18, className = '', fill = false }) => {
  const icons = (typeof lucide !== 'undefined' && lucide.icons) || {};
  const key = ICON_ALIAS[name] || pascal(name);
  const node = icons[key] || icons[pascal(name)] || null;

  /* lucide 的图标节点有两种结构：
     [tag, attrs, children]（新版）或 [[tag, attrs], ...]（旧版），这里统一处理 */
  let list = [];
  if (node) {
    if (Array.isArray(node) && node[0] === 'svg' && Array.isArray(node[2])) list = node[2];
    else if (Array.isArray(node) && typeof node[0] === 'string') list = [node];
    else if (Array.isArray(node)) list = node;
  }
  const children = list
    .filter(c => Array.isArray(c) && typeof c[0] === 'string')
    .map((c, i) => React.createElement(c[0], { key: i, ...(c[1] || {}) }));

  return (
    <svg
      width={size} height={size} viewBox="0 0 24 24" className={className}
      fill={fill ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="1.8"
      strokeLinecap="round" strokeLinejoin="round"
      style={{ display: 'inline-block', verticalAlign: 'middle', flexShrink: 0 }}
    >
      {children.length > 0 ? children : <circle cx="12" cy="12" r="4" opacity="0.35" />}
    </svg>
  );
};

    </div>
  );
};

/* ---------- 通用子页 Header ---------- */
const Header = ({ title, onBack, right, subtitle, bg = 'bg-white/95 backdrop-blur', close = false }) => {
  const app = useApp();
  /* 统一返回处理器：阻止事件冒泡/默认行为，避免被父级滚动或弹层拦截 */
  const handleBack = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (onBack) onBack();
    else app.back();
  };
  return (
    <div className={`sticky top-0 z-20 ${bg} shadow-[0_1px_0_rgba(0,0,0,0.03)]`}>
      <div className="h-12 px-1 flex items-center">
        <button
          type="button"
          aria-label={close ? '关闭' : '返回'}
          onClick={handleBack}
          className="w-12 h-12 -ml-1 flex items-center justify-center rounded-xl active:bg-[#E8F0EB] active:scale-95 transition-transform touch-manipulation"
        >
          <Icon name={close ? 'x' : 'chevron-left'} size={close ? 21 : 22} className="text-[#1F2937]" />
        </button>
        <div className="flex-1 text-center min-w-0">
          <div className="text-[15px] font-semibold text-[#1A2A22] leading-tight truncate">{title}</div>
          {subtitle && <div className="text-[11px] text-[#8C9A94] mt-0.5 truncate">{subtitle}</div>}
        </div>
        <div className="min-w-[48px] h-12 flex items-center justify-center px-1">{right}</div>
      </div>
    </div>
  );
};

/* ---------------- 学校选择器：可搜索 + A-Z 分组 + 校区合并 ---------------- */
const SchoolPicker = ({ open, onClose, value, onSelect }) => {
  const [q, setQ] = useState('');
  useEffect(() => { if (open) setQ(''); }, [open]);

  const full = (s) => `${s.name || ''} · ${s.campus || ''}`;
  const keyword = q.trim();

  /* 相关性排序：校名以关键字开头 → 校名包含 → 校区包含 → 其他包含 */
  const rank = (s) => {
    if (!keyword) return 0;
    const name = s.name || '';
    if (name.startsWith(keyword)) return 0;
    if (name.includes(keyword)) return 1;
    if ((s.campus || '').includes(keyword)) return 2;
    if (full(s).includes(keyword)) return 3;
    return 9;
  };

  const list = SCHOOLS
    .filter(s => !keyword || rank(s) < 9)
    .sort((a, b) => (keyword ? rank(a) - rank(b) || a.name.localeCompare(b.name, 'zh') : 0));

  const groups = {};
  list.forEach(s => {
    const k = keyword ? '搜索结果' : (s.letter || '其他');
    (groups[k] = groups[k] || []).push(s);
  });
  /* 输入关键字但没有命中时不能返回不存在的分组，否则 groups[k] 为 undefined 会让页面白屏 */
  const groupKeys = keyword ? (groups['搜索结果'] ? ['搜索结果'] : []) : Object.keys(groups).sort();

  return (
    <Modal open={open} onClose={onClose} title="选择学校与校区" maxH="max-h-[84%]">
      <div className="sticky top-0 z-10 bg-white px-4 pt-3 pb-3 border-b border-[#EEF5F2]">
        <div className="flex items-center gap-2 bg-[#F4FAF8] rounded-full px-3.5 py-2.5">
          <Icon name="search" size={16} className="text-[#9CA3AF]" />
          <input
            value={q}
            onChange={e => setQ(e.target.value)}
            onKeyDown={e => e.stopPropagation()}
            type="text"
            autoComplete="off"
            autoCorrect="off"
            spellCheck={false}
            placeholder="输入学校名，如「成都」"
            className="flex-1 text-sm bg-transparent focus:outline-none"
          />
          {q && <button type="button" onClick={() => setQ('')}><Icon name="x" size={14} className="text-[#9CA3AF]" /></button>}
        </div>
      </div>
      <div className="px-4 pb-6">
        {groupKeys.length === 0 && (
          <div className="py-12 text-center">
            <div className="text-sm text-[#9CA3AF]">没有找到相关学校</div>
            <div className="text-[11px] text-[#C4CDD5] mt-1.5">试试只输入校名中的两个字，如「成都」</div>
          </div>
        )}
        {groupKeys.map(k => (
          <div key={k}>
            <div className="text-[11px] font-semibold text-[#9CA3AF] mt-3 mb-1">{k}</div>
            {(groups[k] || []).map((s, i) => {
              const active = value && value.name === s.name && value.campus === s.campus;
              return (
                <button
                  key={`${s.name}-${s.campus}-${i}`}
                  onClick={() => onSelect(s)}
                  className={`w-full flex items-center justify-between py-2.5 px-3 rounded-xl mb-1 ${active ? 'bg-[#E6F7F2]' : 'active:bg-[#F7FBFA]'}`}
                >
                  <div className="text-left">
                    <div className={`text-sm ${active ? 'text-[#0F9F76] font-medium' : 'text-[#1F2937]'}`}>{s.name}</div>
                    <div className="text-[11px] text-[#9CA3AF]">{s.campus}{s.emailDisabled ? ' · 仅支持学号验证' : ''}</div>
                  </div>
                  {active && <Icon name="check" size={16} className="text-brand" />}
                </button>
              );
            })}
          </div>
        ))}
      </div>
    </Modal>
  );
};

/* ---------- 注册 ---------- */
const RegisterPage = () => {
  const app = useApp();
  const [mode, setMode] = useState('login'); // login / register
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [code, setCode] = useState('');
  const [countdown, setCountdown] = useState(0);

  useEffect(() => {
    if (countdown <= 0) return;
    const t = setTimeout(() => setCountdown(countdown - 1), 1000);
    return () => clearTimeout(t);
  }, [countdown]);

  const validPhone = /^1\d{10}$/.test(phone);
  const validCode = /^\d{4,6}$/.test(code);
  const canSubmit = validPhone && validCode && (mode === 'login' || name.trim().length >= 1);

  /* 登录与注册是两条完全独立的路径：
     - 登录（老用户）：直接进入广场，不再走实名认证与完善资料；
     - 注册（新用户）：实名认证 → 完善资料三步曲 → 广场。 */
  const submit = () => {
    if (!validPhone) { app.toast('请输入正确的手机号'); return; }
    if (!validCode) { app.toast('请输入验证码'); return; }

    if (mode === 'login') {
      app.tab('square');
      return;
    }

    if (!name.trim()) { app.toast('请设置网名'); return; }
    app.go('auth');
  };

  return (
    <Page>
      <div className="px-6 pt-2">
        <button onClick={() => app.back()} className="w-9 h-9 flex items-center justify-center -ml-2 mb-2">
          <Icon name="chevron-left" size={22} className="text-[#1F2937]" />
        </button>

        {/* 登录 / 注册 双轨 Tab */}
        <div className="flex items-end gap-6 mb-2">
          {[
            { k: 'login', label: '登录' },
            { k: 'register', label: '注册' },
          ].map(t => (
            <button key={t.k} type="button" onClick={() => setMode(t.k)}
              className={`relative pb-1 text-[24px] font-bold transition-colors ${mode === t.k ? 'text-[#1F2937]' : 'text-[#C4CDD5]'}`}>
              {t.label}
              {mode === t.k && <span className="absolute -bottom-0.5 left-0 right-0 h-[3px] bg-brand rounded-full" />}
            </button>
          ))}
        </div>
        <p className="text-[13px] text-[#9CA3AF] mb-8">{mode === 'login' ? '欢迎回来，继续你的校园组队之旅' : '填写信息，开启校园组队之旅'}</p>

        <div className="space-y-4">
          {mode === 'register' && (
            <div>
              <label className="text-[12px] text-[#4B5563] mb-1.5 block">网名</label>
              <input value={name} onChange={e => setName(e.target.value)} placeholder="给自己起个昵称"
                className="w-full bg-white border border-[#EAF2EF] rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand" />
            </div>
          )}
          <div>
            <label className="text-[12px] text-[#4B5563] mb-1.5 block">手机号</label>
            <input value={phone} onChange={e => setPhone(e.target.value)} inputMode="numeric" maxLength={11} placeholder="请输入手机号"
              className="w-full bg-white border border-[#EAF2EF] rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand" />
          </div>
          <div>
            <label className="text-[12px] text-[#4B5563] mb-1.5 block">验证码</label>
            <div className="flex gap-2.5">
              <input value={code} onChange={e => setCode(e.target.value)} inputMode="numeric" maxLength={6} placeholder="6 位验证码"
                className="flex-1 bg-white border border-[#EAF2EF] rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand" />
              <button
                onClick={() => { if (!validPhone) { app.toast('请先输入正确的手机号'); return; } if (countdown === 0) setCountdown(60); }}
                disabled={countdown > 0}
                className="px-4 rounded-xl text-[12px] font-medium bg-[#E6F7F2] text-[#0F9F76] active:scale-95 transition-transform disabled:opacity-60 whitespace-nowrap"
              >
                {countdown > 0 ? `${countdown}s 后重发` : '获取验证码'}
              </button>
            </div>
          </div>
        </div>

        <button onClick={submit} disabled={!canSubmit}
          className={`w-full mt-8 py-3.5 rounded-xl text-[15px] font-medium transition-all ${canSubmit ? 'bg-brand text-white active:bg-[#12A17A] active:scale-95' : 'bg-[#DDE7E3] text-[#9CA3AF]'}`}>
          {mode === 'login' ? '立即登录' : '注册并进入'}
        </button>
        <p className="text-center text-[11px] text-[#9CA3AF] mt-4">登录即代表同意《用户协议》《隐私政策》</p>
      </div>
    </Page>
  );
};

/* ---------- 实名认证 ---------- */
const AuthPage = () => {
  const app = useApp();
  const [realName, setRealName] = useState('');
  const [school, setSchool] = useState({ name: '成都信息工程大学', campus: '航空港校区' });
  const [schoolOpen, setSchoolOpen] = useState(false);
  const [major, setMajor] = useState('');
  const [cls, setCls] = useState('');
  const [verifyType, setVerifyType] = useState('id');
  const [stuNo, setStuNo] = useState('');
  const [email, setEmail] = useState('');
  const [mailCode, setMailCode] = useState('');
  const [mailCountdown, setMailCountdown] = useState(0);
  const [authLoading, setAuthLoading] = useState(false);
  const [authSuccess, setAuthSuccess] = useState(false);
  const [errors, setErrors] = useState({});
  const [shake, setShake] = useState(false);

  useEffect(() => {
    if (mailCountdown <= 0) return;
    const t = setTimeout(() => setMailCountdown(mailCountdown - 1), 1000);
    return () => clearTimeout(t);
  }, [mailCountdown]);

  const clearErr = (k) => setErrors(prev => (prev[k] ? { ...prev, [k]: undefined } : prev));

  /* 表单校验：逐项高亮错误 + 抖动 + 明确文案提示 */
  const startAuth = () => {
    const next = {};
    if (!realName.trim()) next.realName = '请填写真实姓名';
    if (!major.trim()) next.major = '请填写专业';
    if (!cls.trim()) next.cls = '请填写班级';
    if (verifyType === 'id' && !stuNo.trim()) next.stuNo = '请填写学号';
    if (verifyType === 'email' && !email.trim()) next.email = '请填写校园邮箱';
    if (verifyType === 'email' && !mailCode.trim()) next.mailCode = '请填写邮箱验证码';

    if (Object.keys(next).length > 0) {
      setErrors(next);
      setShake(true);
      setTimeout(() => setShake(false), 420);
      const baseMissing = next.realName || next.major || next.cls;
      app.toast(baseMissing ? '请完整填写姓名、专业和班级信息' : '请补充学号或邮箱验证信息');
      return;
    }

    setErrors({});
    setAuthLoading(true);
    setTimeout(() => { setAuthLoading(false); setAuthSuccess(true); }, 2000);
  };

  const fieldCls = (k) => `w-full bg-white rounded-xl px-4 py-3 text-sm focus:outline-none transition-colors ${errors[k] ? 'border border-red-500 ring-1 ring-red-500/40' : 'border border-[#EAF2EF] focus:border-brand'}`;

  const FieldError = ({ k }) => errors[k] ? (
    <div className="text-[11px] text-red-500 mt-1.5 flex items-center gap-1">
      <Icon name="alert-circle" size={11} /> {errors[k]}
    </div>
  ) : null;

  useEffect(() => {
    if (school.emailDisabled && verifyType === 'email') {
      setVerifyType('id');
      app.toast('该校暂不支持邮箱验证，已为你切换为学号验证');
    }
  }, [school]);

  const pickSchool = (s) => {
    setSchool(s);
    setSchoolOpen(false);
  };

  return (
    <Page
      overlays={
        <>
          <SchoolPicker open={schoolOpen} onClose={() => setSchoolOpen(false)} value={school} onSelect={pickSchool} />

          {/* 认证中：全屏雷达扫描 Loading */}
          {authLoading && (
            <div className="absolute inset-0 z-[70] bg-white/95 flex flex-col items-center justify-center fade-in">
              <div className="relative w-40 h-40 flex items-center justify-center">
                <div className="absolute inset-0 rounded-full border-2 border-[#20C997]/30" />
                <div className="absolute inset-3 rounded-full border-2 border-[#20C997]/50" />
                <div className="absolute inset-6 rounded-full border-2 border-[#20C997]/70" />
                <div className="absolute inset-0 rounded-full border-t-2 border-brand animate-spin" />
                <div className="w-6 h-6 rounded-full bg-brand shadow-lg shadow-brand/50 animate-pulse" />
              </div>
              <div className="mt-6 text-[15px] font-medium text-[#1F2937]">正在校验学生身份…</div>
              <div className="text-[11px] text-[#9CA3AF] mt-1">扫描学籍信息中，请稍候</div>
            </div>
          )}

          {/* 认证成功 Modal */}
          <Modal
            open={authSuccess}
            onClose={() => {}}
            maxH="max-h-[56%]"
            footer={
              <div className="p-4">
                <button onClick={() => { setAuthSuccess(false); app.go('setup'); }}
                  className="w-full bg-brand text-white py-3.5 rounded-xl text-[15px] font-medium active:bg-[#12A17A] active:scale-95 transition-all">
                  开始平台旅程
                </button>
              </div>
            }
          >
            <div className="flex flex-col items-center px-6 pt-8 pb-2 text-center">
              <div className="text-[52px] mb-2">🎉</div>
              <div className="text-[17px] font-bold text-[#1F2937]">恭喜你，认证成功！</div>
              <div className="text-[13px] text-[#0F9F76] mt-1.5">获得已实名专属绿盾</div>
              <div className="mt-4 flex items-center gap-1.5 bg-[#E6F7F2] text-[#0F9F76] px-3 py-1.5 rounded-full text-[12px]">
                <Icon name="shield-check" size={15} /> 已实名用户
              </div>
            </div>
          </Modal>
        </>
      }
    >
      <div className="px-6 pt-2">
        <button onClick={() => app.back()} className="w-9 h-9 flex items-center justify-center -ml-2 mb-2">

              disabled={school.emailDisabled}
              className={`flex-1 py-2.5 rounded-xl text-[13px] font-medium flex items-center justify-center gap-1.5 transition-transform ${school.emailDisabled ? 'bg-[#F4FAF8] text-[#C4CDD5] cursor-not-allowed' : verifyType === 'email' ? 'bg-brand text-white active:scale-95' : 'bg-[#E6F7F2] text-[#0F9F76] active:scale-95'}`}
            >

            <div className="mt-3 fade-in">

        <button onClick={startAuth} className="w-full mt-8 bg-brand text-white py-3.5 rounded-xl text-[15px] font-medium active:bg-[#12A17A] active:scale-95 transition-all">

  );
};

/* ---------- 完善资料：3 步引导 ---------- */
const SETUP_CATS = [
  { key: 'projects', label: '项目经历' },
  { key: 'awards', label: '资格证书与奖状' },
  { key: 'works', label: '个人作品集' },
];

const ProfileSetupPage = () => {
  const app = useApp();
  const [step, setStep] = useState(1);

  // Step1
  const [avatar, setAvatar] = useState(AVATARS[5]);
  const [showMajor, setShowMajor] = useState(false);
  const [showName, setShowName] = useState(false);
  const [sheet, setSheet] = useState(false);
  const [picker, setPicker] = useState(false);
  const [pickerMode, setPickerMode] = useState('image');

  // Step2
  const [comps, setComps] = useState([]);
  const [compOpen, setCompOpen] = useState(false);
  const [projects, setProjects] = useState([]);
  const [customIntent, setCustomIntent] = useState('');
  const [skills, setSkills] = useState([]);
  const [skillOpen, setSkillOpen] = useState(false);

  // Step3
  const [cat, setCat] = useState('projects');
  const [entries, setEntries] = useState({
    projects: [{ id: 1, text: '', files: [] }],
    awards: [{ id: 2, text: '', files: [] }],
    works: [{ id: 3, text: '', files: [] }],
  });
  const [upSheet, setUpSheet] = useState(false);
  const [upTarget, setUpTarget] = useState(null);
  const [upPicker, setUpPicker] = useState(false);
  const [upMode, setUpMode] = useState('image');

  const toggle = (arr, setArr, v) => setArr(arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]);
  const avatarIdx = AVATARS.findIndex(a => a.emoji === avatar.emoji);

  const addEntry = () => {
    const list = entries[cat];
    setEntries({ ...entries, [cat]: [...list, { id: Date.now(), text: '', files: [] }] });
  };
  const updateEntry = (id, patch) => {
    setEntries({ ...entries, [cat]: entries[cat].map(e => e.id === id ? { ...e, ...patch } : e) });
  };
  const removeEntry = (id) => {
    setEntries({ ...entries, [cat]: entries[cat].filter(e => e.id !== id) });
  };
  const onUploadPick = (file) => {
    if (!upTarget) return;
    const e = entries[cat].find(x => x.id === upTarget);
    if (!e) return;
    updateEntry(upTarget, { files: [...e.files, file] });
    setUpTarget(null);
  };
  const progress = step;

  return (
    <Page
      overlays={
        <>
          <ActionSheet
            open={sheet}
            onClose={() => setSheet(false)}
            actions={[
              { label: '拍照', onClick: () => { setPickerMode('image'); setPicker(true); } },
              { label: '从相册选择', onClick: () => { setPickerMode('image'); setPicker(true); } },
            ]}
          />
          <MockMediaPicker
            open={picker}
            onClose={() => setPicker(false)}
            mode="image"
            onPick={(f) => {
              const idx = parseInt(f.name.replace(/\D/g, ''), 10) % AVATARS.length;
              setAvatar(AVATARS[idx]);
            }}
          />
          <CompetitionPicker
            open={compOpen}
            onClose={() => setCompOpen(false)}
            value={comps}
            onConfirm={(v) => { setComps(v); setCompOpen(false); }}
          />
          <SplitSkillPicker
            open={skillOpen}
            onClose={() => setSkillOpen(false)}
            value={skills}
            onConfirm={(v) => { setSkills(v); setSkillOpen(false); }}
          />
          <ActionSheet
            open={upSheet}
            onClose={() => setUpSheet(false)}
            actions={[
              { label: '从相册选择图片', onClick: () => { setUpMode('image'); setUpPicker(true); } },
              { label: '选择文件', onClick: () => { setUpMode('file'); setUpPicker(true); } },
            ]}
          />
          <MockMediaPicker
            open={upPicker}
            onClose={() => setUpPicker(false)}
            mode={upMode}
            onPick={onUploadPick}
          />
        </>
      }
    >
      <div className="px-5 pt-2 pb-8">
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-1">
            <button onClick={() => step > 1 ? setStep(step - 1) : app.back()} className="w-9 h-9 flex items-center justify-center -ml-2">
              <Icon name="chevron-left" size={22} className="text-[#1F2937]" />
            </button>
            <span className="text-[12px] text-[#9CA3AF]">{step}/3</span>
          </div>
          <button onClick={() => app.tab('square')} className="text-[12px] text-[#9CA3AF]">跳过</button>
        </div>

        <div className="flex gap-1.5 mb-6">
          {[1, 2, 3].map(i => <div key={i} className={`h-1.5 flex-1 rounded-full transition-colors ${i <= progress ? 'bg-brand' : 'bg-[#E4EDEA]'}`} />)}
        </div>

        {step === 1 && (
          <div className="fade-in">
            <h2 className="text-[21px] font-bold text-[#1F2937]">上传头像</h2>
            <p className="text-[13px] text-[#9CA3AF] mt-1 mb-7">一个舒服的头像会让人更愿意点开你</p>

            <div className="flex flex-col items-center mb-7">
              <div className="relative">
                <button onClick={() => setSheet(true)} className="active:scale-95 transition-transform">
                  <Avatar src={avatar} size={104} />
                </button>
                <button onClick={() => setSheet(true)} className="absolute bottom-0 right-0 w-9 h-9 bg-brand rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-transform">
                  <Icon name="camera" size={17} className="text-white" />
                </button>
              </div>
              <button
                onClick={() => setAvatar(AVATARS[(avatarIdx + 1) % AVATARS.length])}
                className="mt-3 text-[12px] text-[#0F9F76] bg-[#E6F7F2] px-3 py-1.5 rounded-full active:scale-95 transition-transform"
              >
                🎲 换一换
              </button>
            </div>

            <div className="space-y-3">
              <div className="flex items-center justify-between bg-white rounded-2xl p-4 shadow-sm">
                <div>
                  <div className="text-[14px] font-medium text-[#1F2937]">公开专业</div>
                  <div className="text-[11px] text-[#9CA3AF] mt-0.5">他人可在你的主页看到专业信息</div>
                </div>
                <button onClick={() => setShowMajor(v => !v)} className={`w-12 h-7 rounded-full p-1 transition-colors ${showMajor ? 'bg-brand' : 'bg-[#DDE7E3]'}`}>
                  <div className={`w-5 h-5 bg-white rounded-full shadow transition-transform ${showMajor ? 'translate-x-5' : ''}`} />
                </button>
              </div>
              <div className="flex items-center justify-between bg-white rounded-2xl p-4 shadow-sm">
                <div>
                  <div className="text-[14px] font-medium text-[#1F2937]">公开真实姓名</div>
                  <div className="text-[11px] text-[#9CA3AF] mt-0.5">他人可在你的主页看到你的真实姓名</div>
                </div>
                <button onClick={() => setShowName(v => !v)} className={`w-12 h-7 rounded-full p-1 transition-colors ${showName ? 'bg-brand' : 'bg-[#DDE7E3]'}`}>
                  <div className={`w-5 h-5 bg-white rounded-full shadow transition-transform ${showName ? 'translate-x-5' : ''}`} />
                </button>
              </div>
            </div>

            <button onClick={() => setStep(2)} className="w-full mt-8 bg-brand text-white py-3.5 rounded-xl text-[15px] font-medium active:bg-[#12A17A] active:scale-95 transition-all">下一步</button>
          </div>
        )}

        {step === 2 && (
          <div className="fade-in">
            <h2 className="text-[21px] font-bold text-[#1F2937]">选择标签</h2>
            <p className="text-[13px] text-[#9CA3AF] mt-1 mb-5">选择你的意向和个人技能</p>

            <div className="bg-white rounded-2xl p-4 shadow-sm mb-3">
              <div className="flex items-center justify-between mb-2">
                <div className="text-[13px] font-medium text-[#1F2937]">意向竞赛</div>
                <button onClick={() => setCompOpen(true)} className="text-[12px] text-brand flex items-center gap-0.5 active:scale-95 transition-transform">
                  <Icon name="plus" size={13} /> 选择
                </button>
              </div>
              {comps.length === 0 ? (
                <div className="text-[11px] text-[#C4CDD5]">还没有选择，可搜索蓝桥杯、挑战杯等</div>
              ) : (
                <div className="flex flex-wrap gap-1.5">
                  {comps.map(c => (
                    <span key={c} className="inline-flex items-center gap-1 bg-[#E6F7F2] border border-[#20C997] text-[#0F9F76] rounded-full px-2.5 py-1 text-[11px]">
                      {c}
                      <button onClick={() => toggle(comps, setComps, c)}><Icon name="x" size={10} /></button>
                    </span>
                  ))}
                </div>
              )}
            </div>

            <div className="bg-white rounded-2xl p-4 shadow-sm mb-3">
              <div className="text-[13px] font-medium text-[#1F2937] mb-2">意向项目</div>
              <div className="flex flex-wrap gap-1.5">
                {['科研项目', '创业项目', '大创项目', '课程项目', '开源项目', '公益项目'].map(p => (
                  <TagChip key={p} small active={projects.includes(p)} onClick={() => toggle(projects, setProjects, p)}>{p}</TagChip>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-2xl p-4 shadow-sm mb-3">
              <div className="text-[13px] font-medium text-[#1F2937] mb-2">自定义意向</div>
              <input value={customIntent} onChange={e => setCustomIntent(e.target.value)} placeholder="比如：想做一款校园工具类产品"
                className="w-full bg-[#F4FAF8] rounded-xl px-3.5 py-2.5 text-[13px] focus:outline-none focus:ring-1 focus:ring-brand" />
            </div>

            <div className="bg-white rounded-2xl p-4 shadow-sm mb-3">
              <div className="flex items-center justify-between mb-2">
                <div className="text-[13px] font-medium text-[#1F2937]">个人技能</div>
                <button onClick={() => setSkillOpen(true)} className="text-[12px] text-brand flex items-center gap-0.5 active:scale-95 transition-transform">
                  <Icon name="plus" size={13} /> 添加技能
                </button>
              </div>
              {skills.length === 0 ? (
                <div className="text-[11px] text-[#C4CDD5]">点「添加技能」，从分类里挑选你擅长的</div>
              ) : (
                <div className="flex flex-wrap gap-1.5">
                  {skills.map(s => (
                    <span key={s} className="inline-flex items-center gap-1 bg-[#E6F7F2] border border-[#20C997] text-[#0F9F76] rounded-full px-2.5 py-1 text-[11px]">
                      {s}
                      <button onClick={() => setSkills(skills.filter(x => x !== s))}><Icon name="x" size={10} /></button>
                    </span>
                  ))}
                </div>
              )}
            </div>

            <button onClick={() => setStep(3)} className="w-full mt-4 bg-brand text-white py-3.5 rounded-xl text-[15px] font-medium active:bg-[#12A17A] active:scale-95 transition-all">下一步</button>
          </div>
        )}

        {step === 3 && (
          <div className="fade-in">
            <h2 className="text-[21px] font-bold text-[#1F2937]">填写经历</h2>
            <p className="text-[13px] text-[#9CA3AF] mt-1 mb-4">展示你的亮点，全部选填</p>

            <div className="flex gap-2 mb-4 overflow-x-auto no-scrollbar">
              {SETUP_CATS.map(c => (
                <button key={c.key} onClick={() => setCat(c.key)}
                  className={`shrink-0 px-3.5 py-2 rounded-full text-[12px] ${cat === c.key ? 'bg-brand text-white font-medium' : 'bg-white text-[#4B5563] border border-[#EAF2EF]'}`}>
                  {c.label}
                </button>
              ))}
            </div>

            {entries[cat].map((e, idx) => (
              <div key={e.id} className="bg-white rounded-2xl p-4 shadow-sm mb-3">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-[11px] text-[#9CA3AF]">{SETUP_CATS.find(c => c.key === cat).label} {idx + 1}</span>
                  {entries[cat].length > 1 && (
                    <button onClick={() => removeEntry(e.id)} className="text-[11px] text-[#EF4444]">删除</button>
                  )}
                </div>
                <textarea
                  value={e.text}
                  onChange={ev => updateEntry(e.id, { text: ev.target.value })}
                  rows={3}
                  placeholder={cat === 'projects' ? '项目名称、你的角色、主要成果…' : cat === 'awards' ? '证书/奖状名称、获得时间、级别…' : '作品名称、简介、链接…'}
                  className="w-full bg-[#F4FAF8] rounded-xl px-3.5 py-2.5 text-[13px] focus:outline-none resize-none"
                />
                {
                  e.files.length > 0 && (
                    <div className="flex flex-wrap gap-1.5 mt-2">
                      {e.files.map((f, i) => (
                        <AttachChip key={i} a={f} onRemove={() => updateEntry(e.id, { files: e.files.filter((_, j) => j !== i) })} />
                      ))}
                    </div>
                  )
                }
                <button
                  onClick={() => { setUpTarget(e.id); setUpSheet(true); }}
                  className="w-full mt-2.5 border-2 border-dashed border-[#DDE7E3] rounded-xl py-3 flex items-center justify-center gap-1.5 text-[12px] text-[#9CA3AF] active:bg-[#F7FBFA]"
                >
                  <Icon name="plus" size={14} /> 点击上传附件
                </button>
              </div>
            ))}

            <button onClick={addEntry} className="w-full py-2.5 rounded-xl border border-dashed border-[#BFE9DC] text-[12px] text-[#0F9F76] mb-4 active:scale-95 transition-transform">
              ＋ 添加一条新的{SETUP_CATS.find(c => c.key === cat).label}
            </button>

            <div className="bg-[#F1F5F9] rounded-xl p-3">
              <p className="text-[11px] text-[#9CA3AF] leading-[1.8]">
                🔒 隐私提示：您上传的附件将存入您的个人信息库。仅作为组队自证使用。如涉及私人信息，请自行打码。所有经历均选填，不填不影响使用。
              </p>
            </div>

            <button
              onClick={() => {
                app.toast('欢迎加入搭子Match！');
                setTimeout(() => app.tab('square'), 300);
              }}
              className="w-full mt-6 bg-brand text-white py-3.5 rounded-xl text-[15px] font-medium active:bg-[#12A17A] active:scale-95 transition-all"
            >
              开启广场之旅
            </button>
          </div>
        )}
      </div>
    </Page>
  );
};

/* ---------------- 搜索页 ----------------
   1) Tab（搜帖子 / 搜用户）在输入框「上方」；
   2) 模糊匹配（includes + 别名），预设关键词一定能命中；
   3) 搜不到时用兜底数据，绝不留空白；
   4) 两套完全不同的热门标签 / 大家都在搜，随 Tab 联动。 */
const SEARCH_ALIAS = {
  '成信大': '成都信息工程大学',
  'cuit': '成都信息工程大学',
  '大创': '大创项目',
  '互联网+': '互联网+ 创新创业大赛',
};

const SEARCH_HOT = {
  post: ['大创招募', '蓝桥杯', '缺前端', '急招', '商赛', '科研项目'],
  user: ['Python', 'UI设计', '算法大佬', '靠谱队长', '国奖得主', '产品经理'],
};

const SEARCH_TRENDING = {
  post: ['成信大 大创 急招', '蓝桥杯 算法 组队', '挑战杯 找导师'],
  user: ['计科 前端 大二', '商赛 国奖 队友', '航空港 可靠队友'],
};

const searchTokens = (kw) => {
  const base = kw.trim().replace(/#/g, '').toLowerCase().split(/\s+/).filter(Boolean);
  const extra = base.map(t => SEARCH_ALIAS[t]).filter(Boolean).map(t => t.toLowerCase());
  return [...new Set([...base, ...extra])];
};

const SearchPage = () => {
  const app = useApp();
  const [kw, setKw] = useState('');
  const [type, setType] = useState('post'); // post | user

  const keyword = kw.trim();
  const showDefault = keyword.length === 0;
  const tokens = keyword ? searchTokens(keyword) : [];
  const hit = (haystack) => tokens.some(tok => haystack.toLowerCase().includes(tok));

  const allPosts = app.posts.filter(p => !p.closed);
  const matchedPosts = keyword ? allPosts.filter(p => {
    const u = getUser(p.userId);
    return hit([p.title, p.cat, p.intent, p.desc, u.name, u.school, ...p.projectTags, ...p.skillTags, ...p.targetTags].join(' '));
  }) : [];
  const matchedUsers = keyword ? USERS.filter(u =>
    hit([u.name, u.school, u.campus, u.major, u.grade, ...u.tags].join(' '))
  ) : [];

  /* 兜底：搜不到也至少给 3 条，避免 Demo 演示穿帮 */
  const fallbackPosts = allPosts.slice(0, 3);
  const fallbackUsers = USERS.slice(0, 3);
  const isPost = type === 'post';
  const exact = isPost ? matchedPosts : matchedUsers;
  const fallback = isPost ? fallbackPosts : fallbackUsers;
  const results = exact.length ? exact : fallback;
  const usedFallback = keyword && exact.length === 0;

  const applyKeyword = (t) => setKw(t);

  const headerTabs = [
    { k: 'post', label: '搜帖子' },
    { k: 'user', label: '搜用户' },
  ];

  return (
    <Page>
      <div className="sticky top-0 z-10 bg-white/95 backdrop-blur px-4 pt-2 pb-3 shadow-[0_1px_0_rgba(0,0,0,0.03)]">
        {/* 第一行：取消 */}
        <div className="flex items-center justify-between">
          <span className="text-xs text-[#8C9A94] font-medium">搜索</span>
          <button onClick={() => app.back()} className="text-sm text-[#4A5551] active:scale-95 transition-transform">取消</button>
        </div>

        {/* 第二行：Tab 在输入框正上方 */}
        <div className="flex items-center gap-7 mt-1 mb-3">
          {headerTabs.map(t => {
            const on = type === t.k;
            return (
              <button key={t.k} onClick={() => setType(t.k)} className="relative pb-1.5">
                <span className={`text-lg ${on ? 'font-bold text-[#2F6B4F]' : 'font-medium text-[#A8B3AD]'}`}>{t.label}</span>
                {on && <span className="absolute bottom-0 left-0 w-7 h-[3px] bg-[#2F6B4F] rounded-full" />}
              </button>
            );
          })}
        </div>

        {/* 第三行：输入框 + 搜索 */}
        <div className="flex items-center gap-2">
          <div className="flex-1 flex items-center gap-2 bg-[#F9FAFB] rounded-full px-4 py-2.5">
            <Icon name="search" size={16} className="text-[#A8B3AD]" />
            <input
              autoFocus
              value={kw}
              onChange={e => setKw(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
              placeholder={isPost ? '搜索帖子标题、标签、竞赛…' : '搜索用户网名、学校、技能…'}
              className="flex-1 text-[13px] bg-transparent focus:outline-none"
            />
            {kw && (
              <button onClick={() => setKw('')}>
                <Icon name="x-circle" size={15} className="text-[#CBD5D9]" />
              </button>
            )}
          </div>
          <button onClick={() => { }} className="px-4 py-2.5 bg-[#2F6B4F] text-white rounded-full text-[13px] font-semibold active:scale-95 active:bg-[#22503A] transition-all">搜索</button>
        </div>
      </div>

      <div className="px-4 pb-6">
        {showDefault ? (
          <div className="pt-2">
            <div className="flex items-center gap-1.5 mb-3">
              <Icon name="flame" size={14} className="text-[#D97706]" />
              <span className="text-sm font-semibold text-[#1A2A22]">热门标签</span>
            </div>
            <div className="flex flex-wrap gap-3">
              {SEARCH_HOT[type].map(t => (
                <button key={t} onClick={() => applyKeyword(t)}
                  className="px-3.5 py-1.5 rounded-full bg-[#F2F5F3] text-[#4A5551] text-xs font-medium active:scale-95 transition-transform">
                  #{t}
                </button>
              ))}
            </div>

            <div className="mt-7 bg-white rounded-2xl p-4 shadow-[0_2px_10px_rgba(0,0,0,0.03)]">
              <div className="flex items-center gap-1.5 mb-3">
                <Icon name="trending-up" size={14} className="text-[#2F6B4F]" />
                <span className="text-sm font-semibold text-[#1A2A22]">大家都在搜</span>
              </div>
              <div className="space-y-1">
                {SEARCH_TRENDING[type].map((s, i) => (
                  <button key={s} onClick={() => applyKeyword(s)}
                    className="w-full flex items-center justify-between py-2 text-xs text-[#4A5551] active:opacity-70 transition-opacity">
                    <span className="flex items-center gap-2.5">
                      <span className={`w-4 h-4 rounded text-[9px] flex items-center justify-center text-white ${i === 0 ? 'bg-[#F87171]' : i === 1 ? 'bg-[#FBBF24]' : 'bg-[#B0BBB5]'}`}>{i + 1}</span>
                      {s}
                    </span>
                    <Icon name="chevron-right" size={13} className="text-[#CBD5D9]" />
                  </button>
                ))}
              </div>
            </div>
          </div>
        ) : (
          <div className="pt-1">
            <div className="text-xs text-[#8C9A94] font-medium mb-3">
              {usedFallback
                ? `关键词「${keyword}」没有完全命中，为你推荐 ${results.length} 个相关内容`
                : `为你找到 ${results.length} 个相关结果`}
            </div>

            {isPost ? (
              <div className="space-y-3">
                {results.map(p => (
                  <PostCard
                    key={p.id}
                    post={p}
                    fav={app.favPosts.includes(p.id)}
                    onFav={() => app.toggleFav(p.id)}
                    onOpen={() => app.go('detail', { postId: p.id })}
                    onAvatar={(uid) => app.go('otherProfile', { userId: uid })}
                  />
                ))}
              </div>
            ) : (
              <div className="space-y-3">
                {results.map(u => (
                  <button key={u.id} onClick={() => app.go('otherProfile', { userId: u.id })}
                    className="w-full bg-white rounded-2xl p-4 shadow-[0_2px_10px_rgba(0,0,0,0.03)] flex items-center gap-3 transition-transform duration-150 active:scale-95">
                    <Avatar src={u.avatar} size={44} />
                    <div className="flex-1 min-w-0 text-left">
                      <div className="flex items-center gap-1">
                        <span className="text-sm font-semibold text-[#1A2A22]">{u.name}</span>
                        {u.verified && <Icon name="shield-check" size={13} className="text-[#2F6B4F]" />}
                      </div>
                      <div className="text-xs text-[#8C9A94] mt-1 truncate">{u.school} · {u.grade} · {u.major}</div>
                      <div className="flex flex-wrap gap-1 mt-2">
                        {u.tags.slice(0, 3).map(t => <span key={t} className="text-[10px] bg-[#F5F7F5] text-[#4A5551] px-2 py-0.5 rounded-full">#{t}</span>)}
                      </div>
                    </div>
                    <Icon name="chevron-right" size={16} className="text-[#CBD5D9]" />
                  </button>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </Page>
  );
};

/* ---------------- 发帖页 ---------------- */
const PostPage = () => {
  const app = useApp();
  const [intent, setIntent] = useState('队伍招募');
  const [cat, setCat] = useState('蓝桥杯');
  const [title, setTitle] = useState('');
  const [skills, setSkills] = useState([]);
  const [targets, setTargets] = useState([]);
  const [desc, setDesc] = useState('');
  const [imgs, setImgs] = useState([]);

  const [aiOpen, setAiOpen] = useState(false);
  const [aiInput, setAiInput] = useState('');
  const [aiBusy, setAiBusy] = useState(false);
  const [voiceOn, setVoiceOn] = useState(false);

  const [compOpen, setCompOpen] = useState(false);
  const [skillOpen, setSkillOpen] = useState(false);
  const [targetOpen, setTargetOpen] = useState(false);
  const [sheet, setSheet] = useState(false);
  const [picker, setPicker] = useState(false);

  const aiTimer = useRef(null);
  useEffect(() => () => { if (aiTimer.current) clearTimeout(aiTimer.current); }, []);

  const openAi = () => { setAiInput(''); setAiBusy(false); setVoiceOn(false); setAiOpen(true); };
  const closeAi = () => { if (aiBusy) return; setAiOpen(false); setVoiceOn(false); };

  /* 语音输入 Demo：2 秒后自动关闭并回填一句预埋文案 */
  const startVoice = () => {
    if (aiBusy) return;
    setVoiceOn(true);
    if (aiTimer.current) clearTimeout(aiTimer.current);
    aiTimer.current = setTimeout(() => {
      setAiInput('我想找个懂算法的队友，一起打蓝桥杯');
      setVoiceOn(false);
    }, 2000);
  };

  /* 一键转化：1.5s Loading → 润色文案回填到「详细描述」 */
  const aiGenerate = () => {
    const raw = aiInput.trim();
    if (!raw) return;
    setAiBusy(true);
    if (aiTimer.current) clearTimeout(aiTimer.current);
    aiTimer.current = setTimeout(() => {
      const isRecruit = intent === '队伍招募';
      const skillHit = ['前端', '后端', 'Python', 'UI设计', '算法', '数据分析', 'Java', 'React']
        .filter(k => raw.includes(k));
      const catHit = ['蓝桥杯', '大创', '挑战杯', '互联网+', '数学建模', 'ACM', '电子设计', '商赛']
        .find(k => raw.includes(k));
      if (catHit) setCat(catHit === '大创' ? '大创项目' : catHit);
      if (skillHit.length) setSkills(skillHit);

      const body = isRecruit
        ? `【项目背景】\n我们正在推进一个认真做的项目，目前已有基础方案与清晰的分工，需要补上关键的一环。\n\n【招募需求】\n${raw}\n\n【合作方式】\n每周固定投入时间，进度透明、分工明确，线上同步 + 线下讨论。\n\n【你能获得】\n一段完整的项目经历、可写进简历的实战成果，以及一群靠谱的队友。`
        : `【自我介绍】\n${raw}\n\n【我想找】\n一支真正想做事的队伍，方向不限，竞赛、大创、创业项目都可以。\n\n【时间投入】\n周中晚上与周末都在，每周可投入 8h 以上，能长期跟。\n\n【我能提供】\n按时交付、主动沟通，遇到问题一起解决。`;

      setDesc(body);
      setAiBusy(false);
      setAiOpen(false);
      setVoiceOn(false);
      app.toast('AI 已为你生成文案');
    }, 1500);
  };

  const publish = () => {
    const finalCat = cat || '自由发挥';
    if (!title.trim()) { app.toast('请填写小标题'); return; }
    if (!desc.trim()) { app.toast('请填写详细描述'); return; }
    const post = {
      id: Date.now(),
      userId: 15,
      intent,
      cat: finalCat,
      title: title.trim(),
      time: '刚刚',
      projectTags: [finalCat],
      skillTags: skills.length ? skills : ['不限技能'],
      targetTags: targets.length ? targets : ['不限要求'],
      desc: desc.trim(),
      iceBreakers: [
        `你好，我在${finalCat}方向有经验，可以聊聊吗？`,
        '请问目前项目进行到哪一步了？',
        '我时间比较稳定，可以长期跟',
      ],
      mine: true,
      closed: false,
    };
    app.setPosts(prev => [post, ...prev]);
    app.toast('发布成功');
    setTimeout(() => app.tab('square', { intent }), 300);
  };

  return (
    <Page
      contentPad="pb-6"
      overlays={
        <>
          {/* AI 帮写：真实 textarea + 语音 + 一键转化 */}
          {aiOpen && (
            <div className="absolute inset-0 z-[60] bg-[#0F1F19]/30 backdrop-blur-[6px] flex items-center justify-center px-5 fade-in"
              onClick={closeAi}>
              <div className="bg-white rounded-3xl w-full p-5 shadow-[0_20px_60px_rgba(15,40,30,0.18)] scale-in"
                onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-1.5 text-[16px] font-bold text-[#1A2A22]">
                    <Icon name="sparkles" size={17} className="text-[#8B5CF6]" /> AI 帮写招募文案
                  </div>
                  <button type="button" onClick={closeAi} className="w-8 h-8 -mr-1 flex items-center justify-center rounded-full active:bg-[#F5F7F5]">
                    <Icon name="x" size={18} className="text-[#8C9A94]" />
                  </button>
                </div>

                <div className="relative">
                  <textarea
                    value={aiInput}
                    onChange={e => setAiInput(e.target.value)}
                    rows={5}
                    placeholder="请用大白话输入你的需求，例如：我想找个会前端的人一起打大创，我负责写文档"
                    className="w-full bg-[#F9FAFB] rounded-2xl px-4 py-3 pb-11 text-sm text-[#1A2A22] leading-relaxed placeholder:text-[#B0BBB5] focus:outline-none focus:ring-2 focus:ring-[#2F6B4F]/20"
                  />
                  <button type="button" onClick={startVoice}
                    className="absolute right-3 bottom-3 inline-flex items-center gap-1 bg-[#E8F0EB] text-[#2F6B4F] text-[11px] font-medium px-2.5 py-1.5 rounded-full active:scale-95 transition-transform">
                    <Icon name="mic" size={12} /> 语音输入
                  </button>
                </div>

                {voiceOn && (
                  <div className="mt-3 flex items-center gap-2.5 bg-[#F5F7F5] rounded-2xl px-3.5 py-3 fade-in">
                    <div className="flex items-end gap-[3px] h-4">
                      {[0, 1, 2, 3, 4].map(i => (
                        <span key={i} className="w-[3px] h-4 bg-[#2F6B4F] rounded-full origin-bottom wave-bar" style={{ animationDelay: `${i * 0.12}s` }} />
                      ))}
                    </div>
                    <span className="text-[11px] text-[#4A5551]">语音输入中… 请说话</span>
                  </div>
                )}

                <button
                  type="button"
                  onClick={aiGenerate}
                  disabled={!aiInput.trim() || aiBusy}
                  className={`mt-4 w-full py-3.5 rounded-full text-[15px] font-bold transition-all flex items-center justify-center gap-2 ${(!aiInput.trim() || aiBusy) ? 'bg-[#E1E8E4] text-[#9FAEA7]' : 'bg-[#2F6B4F] text-white shadow-[0_8px_20px_rgba(47,107,79,0.2)] active:scale-95 active:bg-[#22503A]'}`}
                >
                  {aiBusy ? (
                    <>
                      <Icon name="loader" size={16} className="animate-spin" /> AI 正在润色中…
                    </>
                  ) : (
                    <>
                      <Icon name="sparkles" size={16} /> 一键转化
                    </>
                  )}
                </button>
                <p className="text-[10px] text-[#B0BBB5] text-center mt-2">生成后会自动回填到「详细描述」</p>
              </div>
            </div>
          )}

          <CompetitionPicker open={compOpen} onClose={() => setCompOpen(false)} value={[cat]}
            onConfirm={(v) => { if (v.length) setCat(v[v.length - 1]); setCompOpen(false); }} />
          <SplitSkillPicker open={skillOpen} onClose={() => setSkillOpen(false)} value={skills}
            onConfirm={(v) => { setSkills(v); setSkillOpen(false); }} />

        <div className="bg-white rounded-2xl p-4 shadow-[0_2px_10px_rgba(0,0,0,0.03)] space-y-3">
          <div className="flex items-center justify-between">
            <div className="text-sm font-semibold text-[#1A2A22]">目标要求</div>
            <button onClick={() => setTargetOpen(true)} className="text-[11px] font-medium text-[#2F6B4F] bg-[#E8F0EB] px-2.5 py-1 rounded-full active:scale-95 transition-transform">

          {targets.length === 0
            ? <div className="text-[11px] text-[#B0BBB5] bg-[#F9FAFB] rounded-xl px-3 py-2.5">年级、时间投入、地点、周期等</div>
            : <div className="flex flex-wrap gap-1.5">
                {targets.map(s => (

                    #{s}
                    <button onClick={() => setTargets(targets.filter(x => x !== s))}><Icon name="x" size={10} /></button>
                  </span>
                ))}
              </div>}
        </div>

        <div>
          <div className="flex items-center justify-between mb-2">
            <div className="text-sm font-semibold text-[#1A2A22]">详细描述</div>
            <button onClick={openAi} className="flex items-center gap-1 text-[#8B5CF6] text-[11px] font-medium bg-[#F3EEFF] px-2.5 py-1 rounded-full active:scale-95 transition-transform">
              <Icon name="sparkles" size={12} /> AI 帮我写

          </div>
          <textarea value={desc} onChange={e => setDesc(e.target.value)} rows={8} placeholder="项目背景、目前进度、需要什么样的人、你能提供什么…"
            className="w-full bg-[#F9FAFB] rounded-2xl px-4 py-3 text-sm text-[#1A2A22] placeholder:text-[#B0BBB5] leading-relaxed focus:outline-none focus:ring-2 focus:ring-[#2F6B4F]/20" />

                <span className="text-xl">🖼️</span>
                <button onClick={() => setImgs(imgs.filter((_, j) => j !== i))} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-white shadow flex items-center justify-center">
                  <Icon name="x" size={11} className="text-[#EF4444]" />

            <button onClick={() => setSheet(true)} className="w-16 h-16 rounded-xl bg-[#F9FAFB] flex flex-col items-center justify-center gap-0.5">

            </button>

        </div>

        <button onClick={publish} className="w-full bg-[#2F6B4F] text-white py-4 rounded-full text-[15px] font-bold shadow-[0_8px_20px_rgba(47,107,79,0.2)] active:scale-95 active:bg-[#22503A] transition-all">
          确认发布

  );
};

/* ---------------- 精准匹配（Wizard 漏斗流） ----------------
   匹配流程的状态提升到全局 app.matchFlow：
   从「匹配结果」跳转到他人主页 / 聊天页，再返回时 phase 与结果数据仍然保留，
   不会退回到匹配入口页，也不会重置成 idle。 */
const MatchPage = () => {
  const app = useApp();
  const mf = app.matchFlow;
  const setMf = app.setMatchFlow;
  const patch = (obj) => setMf(prev => ({ ...prev, ...obj }));

  const [sourceOpen, setSourceOpen] = useState(false);
  const [pick, setPick] = useState(null); // intent | skill | target
  const [progress, setProgress] = useState(0);

  const myPosts = app.posts.filter(p => p.mine);
  const lib = app.library;

  useEffect(() => {
    if (mf.phase !== 'loading') return;
    setProgress(0);
    const t = setInterval(() => setProgress(p => (p >= 100 ? 100 : p + 4)), 60);
    return () => clearInterval(t);
  }, [mf.phase]);

  useEffect(() => {
    if (mf.phase === 'loading' && progress >= 100) {
      const t = setTimeout(() => patch({ phase: 'result', pool: 0 }), 320);
      return () => clearTimeout(t);
    }
  }, [progress, mf.phase]);

  const pickSource = (key) => {
    setSourceOpen(false);
    patch({ source: key, selPost: null, phase: 'sourceView' });
  };
  const backToEntry = () => patch({ phase: 'idle' });
  const cancelFlow = () => { patch({ phase: 'idle' }); app.toast('已取消匹配'); };
  const nextBatch = () => {
    if (mf.pool < MATCH_POOLS.length - 1) patch({ pool: mf.pool + 1 });
    else patch({ phase: 'empty' });
  };

  const canNext = mf.source === 'post'
    ? !!mf.selPost
    : mf.source === 'manual'
      ? (mf.intents.length + mf.skills.length + mf.targets.length > 0)
      : true;

  const SOURCE_META = {
    profile: { title: '个人信息库', sub: '确认提取以下画像信息' },
    post: { title: '选择我的帖子', sub: '从帖子中提取你的组队需求' },
    manual: { title: '手动筛选条件', sub: '按你的需求自定义搭子画像' },
  };
  const meta = SOURCE_META[mf.source] || SOURCE_META.profile;

  /* 手动筛选的可点选区块：标题 + 已选标签 + 添加/修改入口 */
  const ManualBlock = ({ emoji, title, tags, hint, onEdit, onRemove }) => (
    <div className="bg-white rounded-2xl p-4 shadow-[0_2px_10px_rgba(0,0,0,0.03)]">
      <div className="flex items-center justify-between mb-2.5">
        <div className="flex items-center gap-1.5">
          <span className="text-[15px]">{emoji}</span>
          <span className="text-sm font-semibold text-[#1A2A22]">{title}</span>
        </div>
        <button type="button" onClick={onEdit}
          className="text-[11px] font-medium text-[#2F6B4F] bg-[#E8F0EB] px-2.5 py-1 rounded-full active:scale-95 transition-transform">
          + 添加/修改
        </button>
      </div>
      {tags.length === 0 ? (
        <div className="text-[11px] text-[#B0BBB5] bg-[#F9FAFB] rounded-xl px-3 py-2.5">{hint}</div>
      ) : (
        <div className="flex flex-wrap gap-1.5">
          {tags.map(t => (
            <button key={t} type="button" onClick={() => onRemove(t)}
              className="inline-flex items-center gap-1 bg-[#E8F0EB] text-[#2F6B4F] rounded-full px-2.5 py-1 text-[11px] active:scale-95 transition-transform">
              {t}<Icon name="x" size={9} />
            </button>
          ))}
        </div>
      )}
    </div>
  );

  const renderSourceView = () => {
    if (mf.source === 'profile') {
      return (
        <div className="space-y-2.5">
          <div className="text-xs text-[#8C9A94] leading-relaxed">系统将从你的个人信息库中提取以下信息，用于生成匹配画像：</div>
          {[
            { k: '意向竞赛', v: (lib.intentComps || []).join('、') || '未填写' },
            { k: '个人技能', v: (lib.skills || []).join('、') || '未填写' },
            { k: '项目经历', v: (lib.projects || []).map(e => e.name || e.text).filter(Boolean).slice(0, 3).join('、') || '未填写' },
            { k: '证书作品', v: (lib.awards || []).length + (lib.works || []).length + ' 项' },
          ].map(row => (
            <div key={row.k} className="bg-white rounded-2xl p-4 shadow-[0_2px_10px_rgba(0,0,0,0.03)] flex items-start gap-3">
              <span className="text-[11px] text-[#8C9A94] w-[60px] shrink-0 pt-0.5">{row.k}</span>
              <span className="text-[13px] text-[#1A2A22] flex-1 leading-relaxed">{row.v}</span>
            </div>
          ))}
        </div>
      );
    }
    if (mf.source === 'post') {
      return (
        <div className="space-y-2.5">
          <div className="text-xs text-[#8C9A94]">选择一条你的帖子，系统会提取其中的需求用于匹配：</div>
          {myPosts.length === 0 && (
            <EmptyState icon="file-text" title="还没有发布帖子" desc="先去发一条招募，再回来匹配吧">
              <button type="button" onClick={() => app.go('post')} className="bg-[#2F6B4F] text-white text-[13px] px-5 py-2.5 rounded-full active:scale-95 transition-transform">去发帖</button>
            </EmptyState>
          )}
          {myPosts.map(p => {
            const on = mf.selPost === p.id;
            return (
              <button key={p.id} type="button" onClick={() => patch({ selPost: p.id })}
                className={`w-full text-left rounded-2xl p-4 border transition-all active:scale-[0.99] ${on ? 'bg-[#E8F0EB] border-[#2F6B4F]' : 'bg-white border-transparent shadow-[0_2px_10px_rgba(0,0,0,0.03)]'}`}>
                <div className="flex items-start gap-2.5">
                  <span className={`w-4 h-4 mt-0.5 rounded-full border-2 flex items-center justify-center shrink-0 ${on ? 'border-[#2F6B4F] bg-[#2F6B4F]' : 'border-[#C9D6D1]'}`}>
                    {on && <Icon name="check" size={10} className="text-white" />}
                  </span>
                  <div className="min-w-0">
                    <div className="text-[13px] font-medium text-[#1A2A22] leading-snug">
                      <span className="text-[#2F6B4F]">【{p.cat}】</span>{p.title}
                    </div>
                    <div className="text-[10px] text-[#8C9A94] mt-1 truncate">{p.intent} · {p.time}</div>
                  </div>
                </div>
              </button>
            );
          })}
        </div>
      );
    }
    return (
      <div className="space-y-3">
        <ManualBlock emoji="🎯" title="意向项目" tags={mf.intents} hint="还没有选择，点右上角添加你感兴趣的比赛或项目"
          onEdit={() => setPick('intent')}
          onRemove={(t) => patch({ intents: mf.intents.filter(x => x !== t) })} />
        <ManualBlock emoji="🛠️" title="所需技能" tags={mf.skills} hint="还没有选择，点右上角添加你需要的技能"
          onEdit={() => setPick('skill')}
          onRemove={(t) => patch({ skills: mf.skills.filter(x => x !== t) })} />
        <ManualBlock emoji="⏱️" title="目标要求" tags={mf.targets} hint="年级、时间投入、地点、周期等"
          onEdit={() => setPick('target')}
          onRemove={(t) => patch({ targets: mf.targets.filter(x => x !== t) })} />
      </div>
    );
  };

  const timeline = ['idle', 'sourceView', 'weight', 'loading', 'result'];
  const stepIndex = timeline.indexOf(mf.phase);

  return (
    <Page
      tab={mf.phase === 'idle' ? 'match' : undefined}
      contentPad={mf.phase === 'idle' ? '' : 'pb-32'}
      bottom={
        (mf.phase === 'sourceView' || mf.phase === 'weight') ? (
          <div className="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur px-4 pt-3 pb-5 z-30 shadow-[0_-4px_20px_rgba(0,0,0,0.04)]">
            <button
              type="button"
              onClick={() => mf.phase === 'weight' ? patch({ phase: 'loading' }) : patch({ phase: 'weight' })}
              disabled={mf.phase === 'sourceView' && !canNext}
              className={`w-full py-4 rounded-full text-[15px] font-bold transition-all ${(mf.phase === 'sourceView' && !canNext)
                ? 'bg-[#E1E8E4] text-[#9FAEA7]'
                : 'bg-[#2F6B4F] text-white shadow-[0_8px_20px_rgba(47,107,79,0.2)] active:scale-95 active:bg-[#22503A]'}`}
            >
              {mf.phase === 'weight' ? '确认并开始匹配' : '提取并下一步'}
            </button>
          </div>
        ) : null
      }
      overlays={
        <>
          {/* 数据源选择 */}
          <Drawer open={sourceOpen} onClose={() => setSourceOpen(false)} title="选择匹配数据源" h="58%">
            <div className="space-y-2.5">
              {[
                { key: 'profile', icon: 'user-circle', t: '基于个人信息库', d: '利用主页已填写的技能、意向与经历' },
                { key: 'post', icon: 'file-text', t: '基于发布帖子', d: myPosts.length ? `已发布 ${myPosts.length} 条帖子` : '暂无帖子，可先去发帖', disabled: myPosts.length === 0 },
                { key: 'manual', icon: 'sliders-horizontal', t: '手动筛选', d: '完全按你自己的条件选择意向、技能与目标' },
              ].map(o => (
                <button key={o.key} type="button" onClick={() => { if (!o.disabled) pickSource(o.key); }}
                  disabled={o.disabled}
                  className={`w-full flex items-start gap-3 p-4 rounded-2xl text-left transition-all ${o.disabled ? 'bg-[#F9FAFB] opacity-60' : 'bg-[#F5F7F5] active:scale-[0.99]'}`}>
                  <div className="w-9 h-9 rounded-xl bg-white flex items-center justify-center shrink-0">
                    <Icon name={o.icon} size={18} className="text-[#2F6B4F]" />
                  </div>
                  <div className="flex-1">
                    <div className="text-[13px] font-semibold text-[#1A2A22]">{o.t}</div>
                    <div className="text-[11px] text-[#8C9A94] mt-1 leading-relaxed">{o.d}</div>
                  </div>
                  <Icon name="chevron-right" size={16} className="text-[#C4CDD5] self-center" />
                </button>
              ))}
            </div>
          </Drawer>

          {/* 手动筛选：复用分类选择器 */}
          <CompetitionPicker open={pick === 'intent'} onClose={() => setPick(null)}
            value={mf.intents} onConfirm={(v) => { patch({ intents: v }); setPick(null); }} />
          <SplitSkillPicker open={pick === 'skill'} onClose={() => setPick(null)}
            value={mf.skills} onConfirm={(v) => { patch({ skills: v }); setPick(null); }} />
          <MultiTagModal open={pick === 'target'} onClose={() => setPick(null)}
            title="选择目标要求" groups={TARGET_GROUPS} value={mf.targets}
            onConfirm={(v) => { patch({ targets: v }); setPick(null); }} />
        </>
      }
    >
      {/* ---------------- 入口页 ---------------- */}
      {mf.phase === 'idle' && (
        <div className="relative min-h-[640px] flex flex-col items-center justify-center px-6 pt-4 pb-10">

const AIPage = () => {
  const app = useApp();
  const mode = app.route.params.mode || 'square';
  const scrollRef = useRef(null);

  const msgs = app.aiChat[mode] || [];
  const setMsgs = (updater) => app.setAiChat(prev => ({
    ...prev,
    [mode]: typeof updater === 'function' ? updater(prev[mode] || []) : updater,
  }));
  const [input, setInput] = useState('');

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [msgs.length]);

  const send = () => {
    const t = input.trim();
    if (!t) return;
    setMsgs(prev => [...prev, { type: 'text', self: true, text: t }]);
    setInput('');
    setTimeout(() => {
      setMsgs(prev => [...prev, {
        type: 'text', self: false,
        text: mode === 'profile'
          ? '收到～你可以告诉我具体想做什么，比如「想找人做挑战杯」或「不知道怎么关闭帖子」，我来帮你。'
          : '收到～我帮你提炼了关键词：同校区、蓝桥杯、算法。你可以点上面的卡片直达匹配大厅，也可以直接去发帖。',
      }]);
    }, 800);
  };

  /* 快捷卡片跳转：push 入栈，返回时顺着历史栈回到 AI 对话页 */
  const jump = (target) => app.go(target);

  return (
    <Page
      scrollRef={scrollRef}
      contentPad="pb-[84px]"
      bottom={
        <div className="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur px-3 py-2.5 pb-5 flex items-center gap-2 z-30 shadow-[0_-4px_20px_rgba(0,0,0,0.03)]">
          <button className="w-9 h-9 flex items-center justify-center shrink-0">
            <Icon name="mic" size={21} className="text-[#A8B3AD]" />
          </button>
          <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') send(); }}
            placeholder="说说你想找什么搭子…"
            className="flex-1 bg-[#F9FAFB] rounded-full px-4 py-2.5 text-[13px] focus:outline-none focus:ring-2 focus:ring-[#2F6B4F]/20" />
          <button onClick={send} className="w-9 h-9 rounded-full bg-[#2F6B4F] flex items-center justify-center shrink-0 active:scale-95 transition-transform">
            <Icon name="send" size={16} className="text-white" />
          </button>
        </div>
      }
    >
      <Header title="搭子 AI 助手" subtitle="校园组队专属" onBack={() => app.back()} />

      <div className="px-4 pt-3">
        <div className="bg-white rounded-2xl p-3.5 mb-4 shadow-[0_2px_10px_rgba(0,0,0,0.03)]">
          <div className="flex items-start gap-2">
            <div className="w-7 h-7 rounded-full bg-gradient-to-br from-[#A78BFA] to-[#8B5CF6] flex items-center justify-center shrink-0">
              <Icon name="sparkles" size={14} className="text-white" />
            </div>
            <p className="text-[11px] text-[#8C9A94] leading-relaxed">
              你好！我是你的专属 AI 组队助手。你可以：<br />
              1. 让我帮你梳理组队意向<br />
              2. 问我任何平台使用问题<br />
              3. 直接告诉我你想干嘛，我会给你快捷跳转
            </p>
          </div>
        </div>

        <div className="space-y-3">
          {msgs.map((m, i) => {
            if (m.type === 'jump') {
              return (
                <div key={i} className="flex justify-start">
                  <div className="max-w-[86%] bg-white rounded-2xl rounded-tl-sm shadow-[0_2px_10px_rgba(0,0,0,0.03)] p-3.5">
                    <div className="flex items-center gap-1.5 mb-2">
                      <Icon name="link" size={13} className="text-[#8B5CF6]" />
                      <span className="text-[11px] text-[#8B5CF6] font-medium">🔗 {m.label}</span>
                    </div>
                    <div className="flex gap-2">
                      {m.buttons.map(b => (
                        <button key={b.text} onClick={() => jump(b.target)}
                          className="flex-1 bg-[#2F6B4F] text-white text-[12px] py-2.5 rounded-xl active:scale-95 transition-transform whitespace-nowrap px-2">
                          {b.text}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              );
            }
            return (
              <div key={i} className={`flex ${m.self ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[80%] px-3.5 py-2.5 text-[13px] leading-relaxed ${m.self ? 'bg-[#2F6B4F] text-white rounded-2xl rounded-tr-sm' : 'bg-white text-[#1A2A22] rounded-2xl rounded-tl-sm shadow-[0_2px_10px_rgba(0,0,0,0.03)]'}`}>

              className="w-full flex items-center gap-3 px-4 py-3 border-b border-[#F5F8F6] text-left active:bg-[#F8FBFA] transition-colors">
              <Avatar src={u.avatar} size={46} />
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-1">
                  <span className="text-[14px] font-medium text-[#1F2937]">{u.name}</span>
                  {u.verified && <Icon name="shield-check" size={12} className="text-brand" />}
                </div>
                <p className="text-[11px] text-[#9CA3AF] truncate mt-0.5">{chatPreview(c)}</p>
              </div>
              <div className="flex flex-col items-end gap-1 shrink-0">
                <span className="text-[10px] text-[#B6C2C8]">{chatLastAt(c)}</span>
                {c.unread > 0 && (
                  <span className="bg-brand text-white text-[9px] rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center">{c.unread}</span>
                )}
              </div>
            </button>
          );
        })}
      </div>
    </Page>
  );
};

/* ---------------- 聊天详情 ---------------- */
const ChatPage = () => {
  const app = useApp();
  const rawId = app.route.params.chatId;
  const chat = app.chats.find(c => String(c.id) === String(rawId)) || null;
  const u = chat ? getUser(chat.userId) : null;
  const post = (chat && app.posts.find(p => p.id === chat.postId)) || app.posts[0] || null;

  const scrollRef = useRef(null);

  const [input, setInput] = useState('');
  const [menu, setMenu] = useState(false);
  const [report, setReport] = useState(false);
  const [contract, setContract] = useState(false);
  const [credential, setCredential] = useState(false);
  const [credSel, setCredSel] = useState([]);

  /* 返回绝对兜底：正常出栈；没有上一页或出栈异常 → 回广场首页，绝不锁死路由 */
  const goBack = () => {
    try {
      if (app.history.length > 1) app.back();
      else app.tab('square');
    } catch (err) {
      app.tab('square');
    }
  };

  const chatId = chat ? chat.id : null;

  /* 进入聊天清零未读：仅在确有未读时更新，避免无意义全局 setState 引发重渲染循环 */
  useEffect(() => {
    if (!chatId) return;
    app.setChats(prev => {
      const target = prev.find(c => c.id === chatId);
      if (!target || target.unread === 0) return prev;
      return prev.map(c => (c.id === chatId ? { ...c, unread: 0 } : c));
    });
  }, [chatId]);

  /* 卸载时无需清理延时（已移除 leaving 机制） */

  const msgCount = chat ? chat.messages.length : 0;
  useEffect(() => {
    const el = scrollRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [chatId, msgCount]);

  const mutate = (fn) => {
    if (!chat) return;
    app.setChats(prev => prev.map(c => (c.id === chat.id ? fn(c) : c)));
  };
  const addMsg = (msg) => mutate(c => ({ ...c, messages: [...c.messages, { ...msg, at: nowHM() }] }));

  const usedIce = chat ? (chat.usedIce || []) : [];
  const iceList = (post && post.iceBreakers) || [];
  const availableIce = iceList.map((t, i) => ({ t, i })).filter(x => !usedIce.includes(x.i));

  const sendIce = (idx, text) => {
    mutate(c => ({
      ...c,
      usedIce: [...(c.usedIce || []), idx],
      messages: [...c.messages, { type: 'text', self: true, text, at: nowHM() }],
    }));
  };

  const sendText = () => {
    const t = input.trim();
    if (!t) return;
    addMsg({ type: 'text', self: true, text: t });
    setInput('');
  };

  /* 换联系方式：无需确认，直接生成绿色微信名片 */
  const sendCreditCard = () => {
    addMsg({ type: 'card' });
    app.toast('已交换联系方式');
  };

  /* 合作组队：签署后关闭弹层，在聊天流里生成契约卡 */
  const signContract = () => {
    setContract(false);
    addMsg({ type: 'contract' });
    app.toast('组队契约已签署');
  };

  /* 发凭证：确认后关闭弹窗，把每一项都生成为一条「文件传输」卡片消息 */
  const sendCredential = () => {
    const picked = CREDENTIAL_ALL.filter(it => credSel.includes(it.id));
    if (picked.length === 0) {
      app.toast('请先勾选要发送的凭证');
      return;
    }
    mutate(c => ({
      ...c,
      messages: [...c.messages, ...picked.map(it => ({
        type: 'file', name: it.name, size: it.size, kind: it.kind, at: nowHM(),
      }))],
    }));
    setCredential(false);
    setCredSel([]);
    app.toast(`已发送 ${picked.length} 项能力凭证`);
  };

  const toggleCred = (id) => {
    setCredSel(prev => (prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]));
  };

  /* 不感兴趣：设为 muted → 从消息列表隐藏、沉淀到沟通过，并自动退回上一页 */
  const mute = () => {
    app.setChatStatus(chat.id, 'muted');
    app.toast('已移入沟通过列表');
    setTimeout(() => app.back(), 260);
  };

  /* 取消不感兴趣：恢复 normal，按钮变回灰色「不感兴趣」 */
  const unmute = () => {
    app.setChatStatus(chat.id, 'normal');
    app.toast('已恢复沟通');
  };

  /* 会话不存在（深链失效 / 数据被清空）：安全兜底，不渲染空白页 */
  if (!chat || !u) {
    return (
      <Page contentPad="pb-10">
        <Header title="聊天" onBack={goBack} />
        <EmptyState icon="message-square" title="会话不存在" desc="这条对话可能已被移除，去消息列表看看吧">
          <button type="button" onClick={() => app.tab('messages')} className="bg-brand text-white text-[13px] px-5 py-2.5 rounded-full active:scale-95 transition-transform">回到消息列表</button>
        </EmptyState>
      </Page>
    );
  }

  const isMuted = app.chatStatus(chat) === 'muted';

  const contractInfo = [
    { k: '项目名称', v: post ? `${post.cat} · ${post.title}` : '校园合作项目' },
    { k: '合作周期', v: '3 个月（可续约）' },
    { k: '分工安排', v: (post && post.skillTags && post.skillTags.length) ? post.skillTags.join(' / ') : '双方共同推进' },
    { k: '投入时间', v: (post && post.targetTags && (post.targetTags.find(t => t.includes('每周') || t.includes('周末') || t.includes('晚上'))) || '每周 8 小时以上') },
  ];

  /* 初始帖子卡片：进入聊天时自动生成的第一条，可点击回到详情页 */
  const renderPostCard = (at) => {
    if (!post) return null;
    return (
      <div className="bg-white rounded-2xl p-3 shadow-sm border border-[#F1F5F3]">
        <div className="flex items-center gap-1 mb-1.5">
          <span className="text-[9px] bg-[#E6F7F2] text-[#0F9F76] px-1.5 py-0.5 rounded">来自帖子</span>
          <span className="text-[10px] text-[#9CA3AF] ml-auto">{at}</span>
        </div>
        <button
          type="button"
          onClick={() => app.go('detail', { postId: post.id })}
          className="w-full text-left active:opacity-70 transition-opacity"
        >
          <div className="text-[13px] font-semibold text-[#1F2937] leading-snug">
            <span className="text-[#0F9F76]">【{post.cat}】</span>{post.title}
          </div>
          <div className="flex flex-wrap gap-1 mt-1.5">
            {(post.skillTags || []).slice(0, 3).map(t => (
              <span key={t} className="text-[10px] bg-[#F4FAF8] text-[#4B5563] px-1.5 py-0.5 rounded">#{t}</span>
            ))}
          </div>
          <div className="text-[11px] text-brand mt-2">查看详情 →</div>
        </button>
      </div>
    );
  };

  return (
    <Page
      scrollRef={scrollRef}
      contentPad="pb-[136px]"
      overlays={
        <>
          {/* 右上角「...」：只有举报这一个选项 */}
          <Drawer open={menu} onClose={() => setMenu(false)} title="更多操作" h="30%">
            <button
              type="button"
              onClick={() => { setMenu(false); setTimeout(() => setReport(true), 120); }}
              className="w-full flex items-center gap-3 py-3.5 px-4 rounded-xl text-[14px] text-[#EF4444] active:bg-[#FEF2F2]"
            >
              <Icon name="flag" size={17} /> 举报该用户
            </button>
          </Drawer>

          {/* 举报表单：原因 + 文本 + 传图，提交后 Toast */}
          <ReportForm
            open={report}
            onClose={() => setReport(false)}
            title="举报该用户"
            onSubmit={() => app.toast('举报已提交，我们会尽快核实')}
          />

          {/* 合作组队：居中契约 Modal */}
          <Modal
            open={contract}
            onClose={() => setContract(false)}
            title="组队契约确认"
            maxH="max-h-[76%]"
            footer={
              <div className="p-4 border-t border-[#EEF5F2] shrink-0">
                <button type="button" onClick={signContract} className="w-full bg-brand text-white py-3.5 rounded-xl text-[14px] font-medium active:bg-[#12A17A] active:scale-95 transition-all">
                  同意并签署
                </button>
              </div>
            }
          >
            <div className="p-4">
              <div className="flex items-center gap-2.5 bg-[#F4FAF8] rounded-2xl p-3.5 mb-4">
                <Avatar src={u.avatar} size={38} />
                <div className="min-w-0">
                  <div className="text-[13px] font-medium text-[#1F2937] truncate">{u.name}</div>
                  <div className="text-[10px] text-[#9CA3AF] truncate">{u.school}{u.campus ? `(${u.campus})` : ''}</div>
                </div>
                <span className="ml-auto text-[10px] bg-[#E6F7F2] text-[#0F9F76] px-2 py-0.5 rounded-full shrink-0">待签署</span>
              </div>
              <div className="space-y-3">
                {contractInfo.map(c => (
                  <div key={c.k} className="flex items-start gap-3">
                    <span className="text-[11px] text-[#9CA3AF] w-[56px] shrink-0 pt-0.5">{c.k}</span>
                    <span className="text-[12px] text-[#1F2937] leading-relaxed flex-1">{c.v}</span>
                  </div>
                ))}
              </div>
              <div className="bg-[#FFFBEB] rounded-xl p-3 mt-4">
                <p className="text-[10px] text-[#92400E] leading-relaxed">签署后双方将受到平台合作信用约束，无故失联会影响信用分。</p>
              </div>
            </div>
          </Modal>

          {/* 发凭证：能力自证（获奖证书 / 项目作品 / 经历简历），Checkbox 多选 */}
          <Modal
            open={credential}
            onClose={() => setCredential(false)}
            title="选择你要发送的能力凭证"
            maxH="max-h-[80%]"
            footer={
              <div className="px-5 pt-2 pb-5 shrink-0">
                <button
                  type="button"
                  onClick={sendCredential}
                  className={`w-full py-3.5 rounded-full text-[15px] font-semibold transition-all active:scale-95 ${credSel.length ? 'bg-[#2F6B4F] text-white shadow-[0_8px_20px_rgba(47,107,79,0.2)]' : 'bg-[#E8F0EB] text-[#8C9A94]'}`}
                >
                  确认发送{credSel.length ? `（${credSel.length}）` : ''}
                </button>
              </div>
            }
          >
            <div className="px-5 pb-1">
              <p className="text-[11px] text-[#8C9A94] leading-relaxed mb-3">
                身份已通过实名认证，这里只需展示你的能力证明，对方仅可查看、不可下载。
              </p>
              {CREDENTIAL_GROUPS.map(g => (
                <div key={g.key} className="mb-4 last:mb-0">
                  <div className="flex items-center gap-1.5 mb-2">
                    <span className="text-[14px]">{g.emoji}</span>
                    <span className="text-[12px] font-semibold text-[#1A2A22]">{g.title}</span>
                    <span className="text-[10px] text-[#B0BBB5] ml-0.5">{g.items.length} 项</span>
                  </div>
                  <div className="space-y-2">
                    {g.items.map(it => {
                      const on = credSel.includes(it.id);
                      const fm = FILE_META[it.kind] || FILE_META.pdf;
                      return (
                        <button
                          key={it.id}
                          type="button"
                          onClick={() => toggleCred(it.id)}
                          className={`w-full flex items-center gap-3 py-2.5 px-3 rounded-2xl text-left transition-all active:scale-[0.99] ${on ? 'bg-[#E8F0EB]' : 'bg-[#F9FAFB]'}`}
                        >
                          <span className={`w-[18px] h-[18px] rounded-[6px] flex items-center justify-center shrink-0 transition-colors ${on ? 'bg-[#2F6B4F]' : 'bg-white ring-1 ring-[#D6E0DC]'}`}>
                            {on && <Icon name="check" size={11} className="text-white" />}
                          </span>
                          <span className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 ${fm.bg}`}>
                            <Icon name={it.kind === 'link' ? 'link' : g.icon} size={15} className={fm.color} />
                          </span>
                          <span className="min-w-0 flex-1">
                            <span className="block text-[12px] font-medium text-[#1A2A22] truncate">{it.name}</span>
                            <span className="block text-[10px] text-[#8C9A94] mt-0.5">{fm.label} · {it.kind === 'link' ? '链接' : it.size}</span>
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </Modal>
        </>
      }
      bottom={
        <div className="absolute bottom-0 left-0 right-0 bg-white border-t border-[#EEF5F2] z-30">
          {/* 破冰气泡：点击后消失，文字直接作为「我」的消息发出 */}
          {availableIce.length > 0 && (
            <div className="px-3 pt-2.5 flex gap-1.5 overflow-x-auto no-scrollbar">
              {availableIce.map(({ t, i }) => (
                <button
                  key={i}
                  type="button"
                  onClick={() => sendIce(i, t)}
                  className="shrink-0 inline-flex items-center gap-1 bg-[#F3EEFF] text-[#7C3AED] text-[11px] px-3 py-1.5 rounded-full active:scale-95 transition-transform"
                >
                  <Icon name="sparkles" size={11} /> {t}
                </button>
              ))}
            </div>
          )}
          <div className="pl-3 pr-3 pt-2 pb-5 flex items-center gap-2">
            <input
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') sendText(); }}
              placeholder="输入消息…"
              className="flex-1 bg-[#F4FAF8] rounded-full px-4 py-2.5 text-[13px] focus:outline-none"
            />
            <button type="button" onClick={sendText} className="w-9 h-9 rounded-full bg-brand flex items-center justify-center shrink-0 active:scale-95 transition-transform">
              <Icon name="send" size={16} className="text-white" />
            </button>
          </div>
        </div>
      }
    >
      {/* 顶部 Header + 正下方快捷工具栏 */}
      <div className="sticky top-0 z-20 bg-white border-b border-[#EEF5F2]">
        <div className="h-12 px-1 flex items-center">
          <button
            type="button"
            aria-label="返回"
            onClick={(e) => { e.preventDefault(); e.stopPropagation(); goBack(); }}
            className="w-12 h-12 -ml-1 flex items-center justify-center rounded-xl active:bg-[#F4FAF8] active:scale-95 transition-transform touch-manipulation"
          >
            <Icon name="chevron-left" size={23} className="text-[#1F2937]" />
          </button>
          <div className="flex-1 text-center min-w-0 px-1">
            <div className="flex items-center justify-center gap-1">
              <span className="text-[14px] font-semibold text-[#1F2937] truncate">{u.name}</span>
              {u.verified && <Icon name="shield-check" size={13} className="text-brand shrink-0" />}
            </div>
            <div className="text-[10px] text-[#9CA3AF] mt-0.5 truncate">{u.school}{u.campus ? `(${u.campus})` : ''}</div>
          </div>
          <button
            type="button"
            aria-label="更多"
            onClick={() => setMenu(true)}
            className="w-12 h-12 -mr-1 flex items-center justify-center rounded-xl active:bg-[#F4FAF8] active:scale-95 transition-transform touch-manipulation"
          >
            <Icon name="more-horizontal" size={20} className="text-[#4B5563]" />
          </button>
        </div>

        <div className="flex items-center px-1.5 pb-2 gap-0.5">
          {[
            { icon: 'users', label: '合作组队', onClick: () => setContract(true), danger: false },
            { icon: 'phone', label: '换联系方式', onClick: sendCreditCard, danger: false },
            { icon: 'file-check', label: '发凭证', onClick: () => { setCredSel([]); setCredential(true); }, danger: false },
            { icon: 'thumbs-down', label: isMuted ? '取消不感兴趣' : '不感兴趣', onClick: isMuted ? unmute : mute, danger: isMuted },
          ].map(a => (
            <button
              key={a.label}
              type="button"
              onClick={a.onClick}
              className="flex-1 flex flex-col items-center gap-0.5 py-1.5 rounded-lg active:scale-95 transition-transform"
            >
              <Icon name={a.icon} size={17} className={a.danger ? 'text-[#EF4444]' : 'text-[#9CA3AF]'} />
              <span className={`text-[9px] whitespace-nowrap ${a.danger ? 'text-[#EF4444]' : 'text-[#9CA3AF]'}`}>{a.label}</span>
            </button>
          ))}
        </div>
      </div>

      <div className="px-3 pt-3 space-y-3">
        {/* 第一条永远是初始帖子卡片 */}
        {renderPostCard(chat.messages[0] && chat.messages[0].type === 'post' ? chat.messages[0].at : '刚刚')}
